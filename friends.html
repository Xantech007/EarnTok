<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>EarnTok · Friends</title>
    <link rel="icon" type="image/png" href="./earntok-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { color-scheme: light; }
        body { min-height: 100vh; background-color: #ffffff; color: #161823; }
        
        /* Hide scrollbars for story tray */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        img.rounded-full, .avatar-img {
            object-fit: cover !important;
            aspect-ratio: 1 / 1 !important;
        }
    </style>
</head>
<body class="bg-white text-[#161823] antialiased flex flex-col min-h-screen">
    <!-- TikTok-Style Sticky Header -->
    <header class="sticky top-0 z-20 border-b border-zinc-100 bg-white/95 backdrop-blur-md">
        <div class="mx-auto flex max-w-lg items-center justify-between px-4 py-3">
            <button type="button" data-history-back class="p-1 text-zinc-900 hover:opacity-70 transition" aria-label="Go back">
                <i data-lucide="arrow-left" class="h-6 w-6 stroke-[2.5]" aria-hidden="true"></i>
            </button>

            <!-- Center: Title -->
            <div class="text-center">
                <h1 class="text-base font-bold text-zinc-900 tracking-tight">Friends</h1>
            </div>

            <!-- Right: Search Button -->
            <button id="toggle-search-btn" class="p-1 text-zinc-900 hover:opacity-70 transition" aria-label="Search Friends">
                <i data-lucide="search" class="h-6 w-6 stroke-[2]" aria-hidden="true"></i>
            </button>
        </div>

        <!-- Collapsible TikTok Search Bar -->
        <div id="search-container" class="hidden px-4 pb-3 pt-1 border-t border-zinc-50">
            <div class="relative flex items-center">
                <i data-lucide="search" class="absolute left-3.5 h-4 w-4 text-zinc-400" aria-hidden="true"></i>
                <input id="friends-search" type="search" placeholder="Search friends & connections…" class="w-full rounded-full bg-zinc-100 pl-10 pr-4 py-2 text-sm text-zinc-900 placeholder:text-zinc-400 outline-none focus:bg-zinc-100/80 transition">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="mx-auto w-full max-w-lg flex-1 pb-24">
        

        <p id="friends-error-message" class="hidden my-3 mx-4 rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm text-rose-600" role="alert"></p>

        <!-- Friends List Section -->
        <div class="px-2 pt-2">
            <div id="friends-list" class="divide-y divide-zinc-50">
                <div class="py-16 text-center text-zinc-400">
                    <i data-lucide="loader" class="h-8 w-8 animate-spin mx-auto text-[#fe2c55] mb-2"></i>
                    <p class="text-sm">Loading your friends and connections…</p>
                </div>
            </div>
        </div>
    </main>

    <!-- BOTTOM MOBILE NAVIGATION BAR -->
    <nav class="fixed inset-x-0 bottom-0 z-30 flex items-center justify-around border-t border-zinc-200 bg-white px-3 pt-2 pb-[max(.5rem,env(safe-area-inset-bottom))] text-xs font-medium shadow-[0_-4px_16px_rgba(0,0,0,.06)]">
        <a href="./index.html" class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-black" aria-label="Home">
            <i data-lucide="home" class="h-6 w-6" aria-hidden="true"></i><span>Home</span>
        </a>
        <a href="friends.html" id="nav-friends" class="flex flex-col items-center text-rose-500 hover:text-black space-y-0.5">
            <i data-lucide="users" class="w-6 h-6" aria-hidden="true"></i>
            <span>Friends</span>
        </a>
        <!-- Create Button (+) with TikTok Dual-Glow Effect -->
        <a href="./index.html?openCreate=1" class="group relative flex h-8 w-[54px] items-center justify-center active:scale-95 transition" aria-label="Create a video or photo">
            <span class="absolute left-0 z-0 h-7 w-[45px] rounded-lg bg-cyan-400" style="background-color:#25f4ee"></span>
            <span class="absolute right-0 z-0 h-7 w-[45px] rounded-lg bg-rose-500" style="background-color:#fe2c55"></span>
            <span class="relative z-10 flex h-7 w-11 items-center justify-center rounded-lg bg-black text-white">
                <i data-lucide="plus" class="w-5 h-5 stroke-[3]" aria-hidden="true"></i>
            </span>
        </a>
        <a href="inbox.html" id="nav-inbox" class="flex flex-col items-center text-gray-400 hover:text-black space-y-0.5 relative">
            <i data-lucide="message-square" class="w-6 h-6" aria-hidden="true"></i>
            <span data-unread-message-badge class="absolute top-0 right-2 hidden min-w-4 h-4 items-center justify-center rounded-full bg-rose-500 px-1 text-[10px] font-bold leading-none text-white" aria-hidden="true"></span>
            <span>Inbox</span>
        </a>
        <a href="./profile.html" id="nav-profile" class="flex flex-col items-center text-gray-400 hover:text-black space-y-0.5">
            <i data-lucide="user" class="w-6 h-6" aria-hidden="true"></i>
            <span>Profile</span>
        </a>
    </nav>
    <script type="module">
        import { auth, db } from './firebase.js';
        import { toggleUserFollow, removeUserFollow } from './follows.js';
        import { enableHistoryBack } from './navigation.js';
        import { subscribeToUnreadMessages } from './unread-messages.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import {
            collection, doc, getDoc, getDocs, query, where
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        lucide.createIcons();
        enableHistoryBack();

        let currentUser = null;
        let unsubscribeUnreadMessages = null;
        let friendsData = [];

        const friendsList = document.getElementById('friends-list');
        const searchInput = document.getElementById('friends-search');
        const searchContainer = document.getElementById('search-container');
        const toggleSearchBtn = document.getElementById('toggle-search-btn');
        const errorMessage = document.getElementById('friends-error-message');

        const defaultAvatar = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80';

        // Toggle Search Drawer
        toggleSearchBtn.addEventListener('click', () => {
            searchContainer.classList.toggle('hidden');
            if (!searchContainer.classList.contains('hidden')) {
                searchInput.focus();
            }
        });

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&#38;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function renderFriends() {
            const searchText = searchInput.value.trim().toLowerCase();

            const filtered = friendsData.filter(user => {
                if (searchText) {
                    const name = (user.fullName || '').toLowerCase();
                    const username = (user.username || '').toLowerCase();
                    return name.includes(searchText) || username.includes(searchText);
                }
                return true;
            });

            if (friendsData.length === 0) {
                friendsList.innerHTML = `
                    <div class="py-16 text-center">
                        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-zinc-100 text-zinc-400 mb-3">
                            <i data-lucide="users" class="h-8 w-8 stroke-[1.8]"></i>
                        </div>
                        <h3 class="font-bold text-base text-zinc-900">No friends or connections yet</h3>
                        <p class="text-xs text-zinc-500 mt-1 max-w-xs mx-auto">Follow creators, gain followers, or connect to see them appear here.</p>
                        <a href="./index.html" class="mt-4 inline-flex items-center gap-2 rounded-full bg-[#fe2c55] px-6 py-2.5 text-xs font-bold text-white hover:bg-[#e0264c] transition shadow-sm">
                            <i data-lucide="compass" class="h-4 w-4"></i> Explore feed
                        </a>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            if (filtered.length === 0) {
                friendsList.innerHTML = `
                    <div class="py-12 text-center text-zinc-500">
                        <p class="text-xs">No connections matching "${escapeHtml(searchText)}".</p>
                    </div>
                `;
                return;
            }

            friendsList.innerHTML = filtered.map(user => {
                const isMutual = user.isFollowing && user.isFollower;
                const avatar = user.profilePic || defaultAvatar;
                const name = user.fullName || 'EarnTok user';
                const handle = user.username ? `@${user.username}` : '';
                const verified = user.verify === 'yes';

                // Relationship label (TikTok Style Subtext)
                let statusSubtext = '';
                if (isMutual) {
                    statusSubtext = '<span class="text-[11px] text-zinc-400">You are friends</span>';
                } else if (user.isFollower) {
                    statusSubtext = '<span class="text-[11px] text-zinc-400">Follows you</span>';
                } else if (user.isFollowing) {
                    statusSubtext = '<span class="text-[11px] text-zinc-400">Following</span>';
                } else {
                    statusSubtext = '<span class="text-[11px] text-zinc-400">Suggested connection</span>';
                }

                // TikTok Layout Buttons (Message button width matched to combined width of Remove + Follow buttons)
                let actionsHtml = '';
                if (isMutual) {
                    actionsHtml = `
                        <div class="flex items-center gap-2 shrink-0">
                            <a href="./message.html?uid=${encodeURIComponent(user.id)}" class="inline-flex items-center justify-center rounded-full bg-zinc-100 hover:bg-zinc-200 px-3 py-1.5 text-xs font-semibold text-zinc-900 transition active:scale-95 w-[164px]">
                                Message
                            </a>
                        </div>
                    `;
                } else {
                    let followButtonHtml = '';
                    if (user.isFollower) {
                        followButtonHtml = `
                            <button class="follow-toggle-btn inline-flex items-center justify-center rounded-full bg-[#fe2c55] hover:bg-[#e0264c] text-white font-semibold px-4 py-1.5 text-xs transition active:scale-95 flex-1 min-w-[85px]" data-uid="${escapeHtml(user.id)}">
                                Follow back
                            </button>
                        `;
                    } else if (user.isFollowing) {
                        followButtonHtml = `
                            <button class="follow-toggle-btn inline-flex items-center justify-center rounded-full bg-[#fe2c55] hover:bg-zinc-200 text-white font-semibold px-4 py-1.5 text-xs transition active:scale-95 flex-1 min-w-[85px]" data-uid="${escapeHtml(user.id)}">
                                Following
                            </button>
                        `;
                    } else {
                        followButtonHtml = `
                            <button class="follow-toggle-btn inline-flex items-center justify-center rounded-full bg-[#fe2c55] hover:bg-[#e0264c] text-white font-semibold px-4 py-1.5 text-xs transition active:scale-95 flex-1 min-w-[85px]" data-uid="${escapeHtml(user.id)}">
                                Follow
                            </button>
                        `;
                    }

                    actionsHtml = `
                        <div class="flex items-center gap-2 shrink-0">
                            <button class="remove-friend-btn inline-flex items-center justify-center rounded-full border border-zinc-200 bg-white hover:bg-zinc-50 px-3 py-1.5 text-xs font-semibold text-zinc-600 transition active:scale-95 min-w-[70px]" data-uid="${escapeHtml(user.id)}" data-name="${escapeHtml(name)}">
                                Remove
                            </button>
                            ${followButtonHtml}
                        </div>
                    `;
                }

                return `
                    <div class="friend-row flex items-center justify-between gap-3 py-3 px-2 hover:bg-zinc-50/80 transition rounded-xl" data-uid="${escapeHtml(user.id)}">
                        <!-- Left: Avatar & Info -->
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            <a href="./view-profile.html?uid=${encodeURIComponent(user.id)}" class="shrink-0 relative">
                                <img src="${escapeHtml(avatar)}" alt="${escapeHtml(name)}" class="h-12 w-12 rounded-full object-cover bg-zinc-100 border border-zinc-100" onerror="this.src='${defaultAvatar}'">
                            </a>
                            <div class="min-w-0 flex-1">
                                <a href="./view-profile.html?uid=${encodeURIComponent(user.id)}" class="block truncate">
                                    <div class="flex items-center gap-1">
                                        <span class="font-bold text-sm text-zinc-900 truncate">${escapeHtml(name)}</span>
                                        ${verified ? '<i data-lucide="badge-check" class="h-3.5 w-3.5 shrink-0 text-sky-400 fill-sky-400/20"></i>' : ''}
                                    </div>
                                    <p class="truncate text-xs text-zinc-400">${escapeHtml(handle)}</p>
                                </a>
                                <div class="mt-0.5">
                                    ${statusSubtext}
                                </div>
                            </div>
                        </div>

                        <!-- Right: Actions -->
                        ${actionsHtml}
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        async function loadFriends() {
            if (!currentUser) return;
            friendsList.innerHTML = `
                <div class="py-16 text-center text-zinc-400">
                    <i data-lucide="loader" class="h-8 w-8 animate-spin mx-auto text-[#fe2c55] mb-2"></i>
                    <p class="text-sm">Loading your connections…</p>
                </div>
            `;
            lucide.createIcons();

            try {
                const [followingSnap, followersSnap, chatsSnap] = await Promise.all([
                    getDocs(query(collection(db, 'follows'), where('followerId', '==', currentUser.uid))),
                    getDocs(query(collection(db, 'follows'), where('followingId', '==', currentUser.uid))),
                    getDocs(query(collection(db, 'chats'), where('participants', 'array-contains', currentUser.uid)))
                ]);

                const followingSet = new Set();
                const followersSet = new Set();
                const chatSet = new Set();
                const allUserIds = new Set();
                const fallbackDataMap = new Map();

                followingSnap.docs.forEach(d => {
                    const id = d.data().followingId;
                    if (id && id !== currentUser.uid) {
                        followingSet.add(id);
                        allUserIds.add(id);
                    }
                });

                followersSnap.docs.forEach(d => {
                    const id = d.data().followerId;
                    if (id && id !== currentUser.uid) {
                        followersSet.add(id);
                        allUserIds.add(id);
                    }
                });

                chatsSnap.docs.forEach(d => {
                    const data = d.data();
                    const parts = Array.isArray(data.participants) ? data.participants : [];
                    parts.forEach(id => {
                        if (id && id !== currentUser.uid) {
                            chatSet.add(id);
                            allUserIds.add(id);
                            if (data.participantData && data.participantData[id]) {
                                fallbackDataMap.set(id, data.participantData[id]);
                            }
                        }
                    });
                });

                if (allUserIds.size === 0) {
                    friendsData = [];
                    renderFriends();
                    return;
                }

                const idList = Array.from(allUserIds);
                const loadedUsers = [];

                for (let i = 0; i < idList.length; i += 10) {
                    const chunk = idList.slice(i, i + 10);
                    const snap = await getDocs(query(collection(db, 'profiles'), where('__name__', 'in', chunk)));
                    const found = new Set();
                    snap.forEach(d => {
                        found.add(d.id);
                        const prof = d.data();
                        loadedUsers.push({
                            id: d.id,
                            fullName: prof.fullName || 'EarnTok user',
                            username: prof.username || '',
                            profilePic: prof.profilePic || '',
                            verify: prof.verify || 'no',
                            isFollowing: followingSet.has(d.id),
                            isFollower: followersSet.has(d.id),
                            hasChat: chatSet.has(d.id)
                        });
                    });

                    for (const id of chunk) {
                        if (!found.has(id)) {
                            if (fallbackDataMap.has(id)) {
                                const fb = fallbackDataMap.get(id);
                                loadedUsers.push({
                                    id,
                                    fullName: fb.fullName || 'EarnTok user',
                                    username: fb.username || '',
                                    profilePic: fb.profilePic || '',
                                    verify: fb.verify || 'no',
                                    isFollowing: followingSet.has(id),
                                    isFollower: followersSet.has(id),
                                    hasChat: chatSet.has(id)
                                });
                            } else {
                                try {
                                    const uSnap = await getDoc(doc(db, 'users', id));
                                    const uData = uSnap.exists() ? uSnap.data() : {};
                                    loadedUsers.push({
                                        id,
                                        fullName: uData.fullName || 'EarnTok user',
                                        username: uData.username || '',
                                        profilePic: uData.profilePic || '',
                                        verify: uData.verify || 'no',
                                        isFollowing: followingSet.has(id),
                                        isFollower: followersSet.has(id),
                                        hasChat: chatSet.has(id)
                                    });
                                } catch (e) {
                                    console.warn('Fallback user fetch error:', e);
                                }
                            }
                        }
                    }
                }

                loadedUsers.sort((a, b) => {
                    const scoreA = (a.isFollowing && a.isFollower ? 2 : a.isFollower ? 1 : 0);
                    const scoreB = (b.isFollowing && b.isFollower ? 2 : b.isFollower ? 1 : 0);
                    if (scoreB !== scoreA) return scoreB - scoreA;
                    return (a.fullName || '').localeCompare(b.fullName || '');
                });

                friendsData = loadedUsers;
                renderFriends();
            } catch (err) {
                console.error('Failed to load friends:', err);
                errorMessage.textContent = 'Could not load your connections. Check your connection.';
                errorMessage.classList.remove('hidden');
                friendsList.innerHTML = '<p class="py-12 text-center text-xs text-[#fe2c55]">Failed to load friends.</p>';
            }
        }

        async function handleFollowToggle(targetUserId, buttonEl) {
            buttonEl.disabled = true;
            try {
                const isNowFollowing = await toggleUserFollow(currentUser.uid, targetUserId, { source: 'friends_page' });
                const user = friendsData.find(u => u.id === targetUserId);
                if (user) {
                    user.isFollowing = isNowFollowing;
                    renderFriends();
                }
            } catch (err) {
                console.error('Error toggling follow:', err);
                alert(err.message || 'Could not update follow status.');
            } finally {
                buttonEl.disabled = false;
            }
        }

        async function handleRemoveConnection(targetUserId, targetUserName) {
            const confirmed = window.confirm(`Remove ${targetUserName || 'this user'} from your connections?`);
            if (!confirmed) return;

            try {
                await Promise.all([
                    removeUserFollow(currentUser.uid, targetUserId),
                    removeUserFollow(targetUserId, currentUser.uid)
                ]);

                friendsData = friendsData.filter(u => u.id !== targetUserId);
                renderFriends();
            } catch (err) {
                console.error('Error removing connection:', err);
                alert('Could not remove connection. Please try again.');
            }
        }

        friendsList.addEventListener('click', event => {
            const followBtn = event.target.closest('.follow-toggle-btn');
            if (followBtn) {
                const uid = followBtn.dataset.uid;
                if (uid) handleFollowToggle(uid, followBtn);
                return;
            }

            const removeBtn = event.target.closest('.remove-friend-btn');
            if (removeBtn) {
                const uid = removeBtn.dataset.uid;
                const name = removeBtn.dataset.name;
                if (uid) handleRemoveConnection(uid, name);
                return;
            }
        });

        searchInput.addEventListener('input', () => {
            renderFriends();
        });

        onAuthStateChanged(auth, user => {
            unsubscribeUnreadMessages?.();
            unsubscribeUnreadMessages = subscribeToUnreadMessages(db, user?.uid);
            if (!user) {
                const returnTo = `${location.pathname}${location.search}`;
                location.replace(`./oauth.html?returnTo=${encodeURIComponent(returnTo)}`);
                return;
            }
            currentUser = user;
            loadFriends();
        });
    </script>
</body>
</html>
