<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>EarnTok · Wallet</title>
    <link rel="icon" type="image/png" href="./earntok-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { color-scheme: light; }
        body { min-height: 100vh; }
        body.bg-zinc-950 { background: #fff !important; color: #161823 !important; }
        .bg-zinc-950, .bg-zinc-950\/90 { background-color: #fff !important; }
        .bg-zinc-900, .bg-zinc-900\/90, .bg-zinc-900\/70 { background-color: #f8f8fa !important; }
        .bg-zinc-800 { background-color: #f1f1f2 !important; }
        .text-zinc-100 { color: #161823 !important; }
        .text-zinc-300 { color: #454550 !important; }
        .text-zinc-400, .text-zinc-500 { color: #777782 !important; }
        .border-zinc-800, .border-zinc-700 { border-color: #e4e4e8 !important; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased">
    <header class="sticky top-0 z-20 border-b border-zinc-800 bg-zinc-950/90 backdrop-blur">
        <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
            <button type="button" data-history-back class="text-zinc-100 hover:opacity-80" aria-label="Go back">
                <i data-lucide="arrow-left" class="h-6 w-6 stroke-[2.5]" aria-hidden="true"></i>
            </button>
            <h1 class="text-lg font-bold">Wallet</h1>
            <a href="./inbox.html" class="relative p-1 text-zinc-100" aria-label="Inbox">
                <i data-lucide="message-square" class="h-6 w-6" aria-hidden="true"></i>
                <span data-unread-message-badge class="absolute -right-1 -top-1 hidden min-w-4 h-4 items-center justify-center rounded-full bg-rose-500 px-1 text-[10px] font-bold leading-none text-white" aria-hidden="true"></span>
            </a>
        </div>
    </header>
    <main class="mx-auto max-w-3xl px-4 py-8">
        <section class="rounded-3xl bg-zinc-900/70 p-6 shadow-sm sm:p-8">
            <p class="flex items-center gap-1 text-sm font-semibold text-zinc-500"><i data-lucide="coins" class="h-4 w-4 text-amber-400" aria-hidden="true"></i>Your coins</p>
            <h2 class="mt-1 text-2xl font-bold">Wallet balance</h2>
            <p id="wallet-error" class="mt-4 hidden rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm text-rose-600" role="alert"></p>
            <div class="mt-6 grid gap-4 sm:grid-cols-2">
                <article class="rounded-2xl border border-zinc-800 bg-white p-5">
                    <p class="text-sm text-zinc-500">Earnings Balance</p>
                    <p id="earnings-balance" class="mt-2 flex items-center gap-2 text-3xl font-bold">— <i data-lucide="coins" class="h-6 w-6 text-amber-400" aria-hidden="true"></i><span class="text-base font-semibold text-zinc-500">coins</span></p>
                </article>
                <article class="rounded-2xl border border-zinc-800 bg-white p-5">
                    <p class="text-sm text-zinc-500">Available Balance</p>
                    <p id="available-balance" class="mt-2 flex items-center gap-2 text-3xl font-bold">— <i data-lucide="coins" class="h-6 w-6 text-amber-400" aria-hidden="true"></i><span class="text-base font-semibold text-zinc-500">coins</span></p>
                </article>
            </div>
            <div class="mt-6 grid gap-3 sm:grid-cols-2">
                <a href="./buy-coins.html" class="inline-flex items-center justify-center gap-2 rounded-xl bg-rose-500 px-5 py-3 font-bold text-white transition hover:bg-rose-600">
                    <i data-lucide="plus-circle" class="h-5 w-5" aria-hidden="true"></i>Buy Coins
                </a>
                <a href="./withdraw-coins.html" class="inline-flex items-center justify-center gap-2 rounded-xl border border-zinc-300 bg-white px-5 py-3 font-bold text-zinc-900 transition hover:bg-zinc-100">
                    <i data-lucide="landmark" class="h-5 w-5" aria-hidden="true"></i>Withdraw Coins
                </a>
            </div>
            <div class="mt-3">
                <button id="transfer-open" type="button" class="hidden w-full items-center justify-center gap-2 rounded-xl border border-zinc-300 bg-white px-5 py-3 font-bold text-zinc-900 transition hover:bg-zinc-100 disabled:cursor-not-allowed disabled:opacity-50">
                    <i data-lucide="arrow-right-left" class="h-5 w-5" aria-hidden="true"></i>Transfer earnings to available balance
                </button>
                <p id="transfer-eligibility" class="mt-2 text-center text-sm text-zinc-500"></p>
            </div>
        </section>
    </main>
    <div id="transfer-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4" aria-hidden="true">
        <section class="w-full max-w-md rounded-2xl bg-white p-6 text-zinc-900 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="transfer-title">
            <div class="flex items-center justify-between">
                <h2 id="transfer-title" class="text-lg font-bold">Transfer earnings</h2>
                <button id="transfer-close" type="button" class="rounded-lg p-2 text-zinc-500 hover:bg-zinc-100" aria-label="Close transfer dialog"><i data-lucide="x" class="h-5 w-5"></i></button>
            </div>
            <p class="mt-2 text-sm text-zinc-500">Move coins from Earnings Balance to Available Balance.</p>
            <p id="transfer-message" class="mt-4 hidden rounded-xl border p-3 text-sm" role="status"></p>
            <form id="transfer-form" class="mt-4 space-y-4">
                <label class="block text-sm font-semibold">Amount (coins)
                    <input id="transfer-amount" class="mt-2 w-full rounded-xl border border-zinc-300 px-4 py-3 outline-none focus:border-rose-500" type="number" min="1" step="1" inputmode="numeric" required>
                </label>
                <div class="flex justify-end gap-2">
                    <button id="transfer-cancel" type="button" class="rounded-xl border border-zinc-300 px-4 py-2.5 text-sm font-semibold hover:bg-zinc-50">Cancel</button>
                    <button id="transfer-submit" type="submit" class="rounded-xl bg-rose-500 px-4 py-2.5 text-sm font-bold text-white hover:bg-rose-600 disabled:opacity-60">Transfer coins</button>
                </div>
            </form>
        </section>
    </div>
    <script type="module">
        import { auth, db } from './firebase.js';
        import { enableHistoryBack } from './navigation.js';
        import { subscribeToUnreadMessages } from './unread-messages.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import {
            collection, doc, getDoc, runTransaction, serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        lucide.createIcons();
        enableHistoryBack();

        function displayCoins(value) {
            const amount = Number(value ?? 0);
            if (!Number.isFinite(amount) || amount < 0) return '0';
            return new Intl.NumberFormat().format(amount);
        }

        const transferModal = document.getElementById('transfer-modal');
        const transferButton = document.getElementById('transfer-open');
        let accountUser = null;

        function setTransferModal(open) {
            transferModal.classList.toggle('hidden', !open);
            transferModal.classList.toggle('flex', open);
            transferModal.setAttribute('aria-hidden', String(!open));
            if (open) document.getElementById('transfer-amount').focus();
        }

        function setWalletMessage(text, isError = false) {
            const target = document.getElementById('transfer-message');
            target.textContent = text;
            target.classList.remove('hidden', 'border-rose-200', 'bg-rose-50', 'text-rose-600', 'border-emerald-200', 'bg-emerald-50', 'text-emerald-700');
            target.classList.add(...(isError
                ? ['border-rose-200', 'bg-rose-50', 'text-rose-600']
                : ['border-emerald-200', 'bg-emerald-50', 'text-emerald-700']));
        }

        onAuthStateChanged(auth, async user => {
            if (!user) {
                const returnTo = `${location.pathname}${location.search}`;
                location.replace(`./oauth.html?returnTo=${encodeURIComponent(returnTo)}`);
                return;
            }
            subscribeToUnreadMessages(db, user.uid);
            try {
                const snapshot = await getDoc(doc(db, 'users', user.uid));
                if (!snapshot.exists()) throw new Error('Your wallet account could not be found.');
                const account = snapshot.data();
                document.getElementById('earnings-balance').innerHTML = `${displayCoins(account.earningsBalance)} <i data-lucide="coins" class="h-6 w-6 text-amber-400" aria-hidden="true"></i><span class="text-base font-semibold text-zinc-500">coins</span>`;
                document.getElementById('available-balance').innerHTML = `${displayCoins(account.availableBalance)} <i data-lucide="coins" class="h-6 w-6 text-amber-400" aria-hidden="true"></i><span class="text-base font-semibold text-zinc-500">coins</span>`;
                lucide.createIcons();
                accountUser = user;
                if (account.verify === 'yes') {
                    transferButton.classList.remove('hidden');
                    transferButton.classList.add('inline-flex');
                    document.getElementById('transfer-eligibility').textContent = 'Verified accounts can transfer earned coins.';
                } else {
                    document.getElementById('transfer-eligibility').textContent = 'Earnings transfers are available to verified accounts only.';
                }
            } catch (error) {
                console.error('Unable to load wallet balances:', error);
                const errorMessage = document.getElementById('wallet-error');
                errorMessage.textContent = error.message || 'Could not load your wallet. Check your connection and try again.';
                errorMessage.classList.remove('hidden');
            }
        }, error => {
            console.error('Unable to read sign-in state:', error);
            const errorMessage = document.getElementById('wallet-error');
            errorMessage.textContent = 'Could not verify your sign-in. Please reload the page.';
            errorMessage.classList.remove('hidden');
        });

        transferButton.addEventListener('click', () => setTransferModal(true));
        document.getElementById('transfer-close').addEventListener('click', () => setTransferModal(false));
        document.getElementById('transfer-cancel').addEventListener('click', () => setTransferModal(false));
        transferModal.addEventListener('click', event => {
            if (event.target === transferModal) setTransferModal(false);
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !transferModal.classList.contains('hidden')) setTransferModal(false);
        });
        document.getElementById('transfer-form').addEventListener('submit', async event => {
            event.preventDefault();
            const amount = Number(document.getElementById('transfer-amount').value);
            const button = document.getElementById('transfer-submit');
            if (!accountUser) return setWalletMessage('Sign in to transfer earnings.', true);
            if (!Number.isSafeInteger(amount) || amount < 1) return setWalletMessage('Enter a positive whole number of coins.', true);
            button.disabled = true;
            try {
                const userRef = doc(db, 'users', accountUser.uid);
                const activityRef = doc(collection(db, 'activities'));
                const updatedBalances = await runTransaction(db, async transaction => {
                    const snapshot = await transaction.get(userRef);
                    if (!snapshot.exists()) throw new Error('Your wallet account could not be found.');
                    const account = snapshot.data();
                    if (account.verify !== 'yes') throw new Error('Only verified users can transfer earnings.');
                    const earningsBalance = Number(account.earningsBalance ?? 0);
                    const availableBalance = Number(account.availableBalance ?? 0);
                    if (!Number.isSafeInteger(earningsBalance) || earningsBalance < amount) {
                        throw new Error('You do not have enough earnings to transfer that amount.');
                    }
                    if (!Number.isSafeInteger(availableBalance) || availableBalance < 0
                        || !Number.isSafeInteger(availableBalance + amount)) {
                        throw new Error('Your available balance cannot accept this transfer.');
                    }
                    transaction.update(userRef, {
                        earningsBalance: earningsBalance - amount,
                        availableBalance: availableBalance + amount
                    });
                    transaction.set(activityRef, {
                        userId: 'system',
                        profileId: accountUser.uid,
                        action: 'coin_transfer',
                        details: { amount, currency: 'coins', from: 'earningsBalance', to: 'availableBalance' },
                        createdAt: serverTimestamp()
                    });
                    return {
                        earningsBalance: earningsBalance - amount,
                        availableBalance: availableBalance + amount
                    };
                });
                document.getElementById('earnings-balance').innerHTML = `${displayCoins(updatedBalances.earningsBalance)} <i data-lucide="coins" class="h-6 w-6 text-amber-400" aria-hidden="true"></i><span class="text-base font-semibold text-zinc-500">coins</span>`;
                document.getElementById('available-balance').innerHTML = `${displayCoins(updatedBalances.availableBalance)} <i data-lucide="coins" class="h-6 w-6 text-amber-400" aria-hidden="true"></i><span class="text-base font-semibold text-zinc-500">coins</span>`;
                lucide.createIcons();
                document.getElementById('transfer-form').reset();
                setWalletMessage('Coins transferred to your available balance.');
            } catch (error) {
                console.error('Unable to transfer wallet earnings:', error);
                setWalletMessage(error.message || 'Could not transfer earnings. Please try again.', true);
            } finally {
                button.disabled = false;
            }
        });
    </script>
    <script type="module" src="./translator.js"></script>
</body>
</html>
