<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>EarnTok · Profile</title>
    <link rel="icon" type="image/png" href="./earntok-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { color-scheme: light; }
        body { min-height: 100vh; }
        .tab-active { color: white; border-color: #fe2c55; }
        body.bg-zinc-950 { background: #fff !important; color: #161823 !important; }
        .bg-zinc-950, .bg-zinc-950\/90 { background-color: #fff !important; }
        .bg-zinc-900, .bg-zinc-900\/90, .bg-zinc-900\/70, .bg-zinc-900\/50 { background-color: #f8f8fa !important; }
        .bg-zinc-800 { background-color: #f1f1f2 !important; }
        .text-zinc-100 { color: #161823 !important; }
        .profile-video-viewer .text-white { color: #fff !important; }
        .text-zinc-300 { color: #454550 !important; }
        .text-zinc-400, .text-zinc-500, .text-zinc-600 { color: #777782 !important; }
        .border-zinc-800, .border-zinc-700 { border-color: #e4e4e8 !important; }
        .tab-active { color: #161823; }
        .text-sky-400 { color: #0284c7 !important; }
        p.text-rose-300 { color: #be123c !important; }
        img.rounded-full, #profile-pic, .avatar-img {
            object-fit: cover !important;
            aspect-ratio: 1 / 1 !important;
        }
        #profile-pic {
            width: 7rem !important;
            height: 7rem !important;
            min-width: 7rem !important;
            min-height: 7rem !important;
            max-width: 7rem !important;
            max-height: 7rem !important;
            flex-shrink: 0 !important;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased">
    <header class="sticky top-0 z-20 border-b border-zinc-800 bg-zinc-950/90 backdrop-blur">
        <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
            <button type="button" data-history-back class="text-zinc-100 hover:opacity-80" aria-label="Go back">
                <i data-lucide="arrow-left" class="h-6 w-6 stroke-[2.5]" aria-hidden="true"></i>
            </button>
            <div class="flex items-center gap-3">
                <a href="./inbox.html" class="relative p-1 text-zinc-100 hover:opacity-80" aria-label="Inbox" title="Inbox">
                    <i data-lucide="message-square" class="h-6 w-6 stroke-[2.2]" aria-hidden="true"></i>
                    <span data-unread-message-badge class="absolute -right-1 -top-1 hidden min-w-4 h-4 items-center justify-center rounded-full bg-rose-500 px-1 text-[10px] font-bold leading-none text-white" aria-hidden="true"></span>
                </a>
            </div>
        </div>
    </header>
    <main class="mx-auto max-w-5xl px-4 pb-16">
        <section class="border-b border-zinc-800 py-8 sm:py-10">
            <div class="flex flex-col gap-6 sm:flex-row sm:items-center">
                <img id="profile-pic" class="h-28 w-28 min-w-[7rem] min-h-[7rem] max-w-[7rem] max-h-[7rem] shrink-0 self-center rounded-full bg-zinc-800 object-cover sm:self-auto" alt="Profile picture">
                <div class="min-w-0 flex-1 text-center sm:text-left">
                    <p class="text-sm text-zinc-500">EarnTok profile</p>
                    <h1 id="profile-name" class="mt-1 truncate text-3xl font-bold">Loading profile…</h1>
                    <p class="mt-1 text-zinc-400"><span class="inline-flex items-center gap-1"><span id="profile-username"></span><i id="profile-verified" data-lucide="badge-check" class="inline-block h-4 w-4 align-middle text-sky-400" title="Verified creator" aria-label="Verified creator"></i></span></p>
                    <div class="mt-4 flex flex-wrap justify-center gap-x-7 gap-y-2 text-sm sm:justify-start">
                        <button id="follower-btn" class="hover:underline cursor-pointer"><strong id="follower-count" class="text-zinc-950">0</strong> followers</button>
                        <button id="following-btn" class="hover:underline cursor-pointer"><strong id="following-count" class="text-zinc-950">0</strong> following</button>
                        <span><strong id="like-count" class="text-zinc-950">0</strong> likes</span>
                    </div>
                    <div class="mt-4 flex flex-wrap items-center justify-center gap-3 sm:justify-start">
                        <button id="follow-button" class="hidden inline-flex items-center justify-center rounded-full bg-rose-500 px-6 py-2 text-sm font-bold text-white hover:bg-rose-600 disabled:cursor-wait disabled:opacity-60" type="button"><i data-lucide="user-plus" class="mr-2 h-4 w-4" aria-hidden="true"></i>Follow</button>
                        <a id="message-button" class="hidden inline-flex items-center justify-center rounded-full bg-zinc-800 px-6 py-2 text-sm font-bold text-zinc-900 hover:bg-zinc-200 border border-zinc-300 transition" href="#" aria-label="Send message"><i data-lucide="message-circle" class="mr-2 h-4 w-4" aria-hidden="true"></i>Message</a>
                    </div>
                    <p id="follow-message" class="mt-2 hidden text-sm text-rose-300" role="status"></p>
                    <p id="profile-bio" class="mx-auto mt-4 max-w-xl whitespace-pre-wrap text-sm text-zinc-300 sm:mx-0"></p>
                </div>
            </div>
        </section>
        <section class="mt-4">
            <div class="border-b border-zinc-800 px-4 py-3 text-sm font-semibold">Posts</div>
            <p id="profile-load-message" class="hidden px-4 pt-4 text-sm text-rose-600" role="alert"></p>
            <div id="posts-grid" class="grid grid-cols-3 gap-[1px] bg-white py-4">
                <div class="col-span-full py-16 text-center text-zinc-400 bg-white">
                    <i data-lucide="loader" class="h-8 w-8 animate-spin mx-auto text-rose-500 mb-2"></i>
                    <p class="text-sm">Loading posts…</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Users Modal -->
    <div id="users-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
        <div class="relative w-full max-w-md rounded-2xl bg-white p-6 shadow-xl max-h-[80vh] flex flex-col">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 id="users-modal-title" class="text-lg font-bold">Users</h3>
                <button id="users-modal-close" class="rounded-lg p-1 text-zinc-500 hover:bg-zinc-100"><i data-lucide="x" class="h-5 w-5"></i></button>
            </div>
            <div id="users-modal-list" class="mt-4 divide-y divide-zinc-100 overflow-y-auto flex-1">
                <div class="py-12 text-center text-zinc-400">
                    <i data-lucide="loader" class="h-8 w-8 animate-spin mx-auto text-rose-500 mb-2"></i>
                    <p class="text-sm">Loading…</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase.js';
        import { enableHistoryBack } from './navigation.js';
        import { getUserFollowStats, toggleUserFollow, isUserFollowing } from './follows.js';
        import { createProfileVideoViewer } from './profile-video-viewer.js';
        import { subscribeToUnreadMessages } from './unread-messages.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { collection, doc, getDoc, getDocs, query, serverTimestamp, where, addDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        lucide.createIcons();
        enableHistoryBack();
        const params = new URLSearchParams(location.search);
        const targetUid = params.get('uid');
        const targetUsername = params.get('username')?.replace(/^@/, '').toLowerCase();
        const videoViewer = createProfileVideoViewer({ auth, db });
        let unsubscribeUnreadMessages = null;

        function getCurrentUser() {
            return new Promise(resolve => {
                const unsubscribe = onAuthStateChanged(auth, current => {
                    unsubscribe();
                    if (current) {
                        unsubscribeUnreadMessages = subscribeToUnreadMessages(db, current.uid);
                    }
                    resolve(current);
                }, error => {
                    console.error('Unable to read sign-in state:', error);
                    resolve(null);
                });
            });
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&#38;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function formatCount(value) {
            return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(value);
        }

        function mediaType(video) {
            if (video.mediaType === 'image') return 'image';
            if (video.mediaType === 'video') return 'video';
            return /\.(avif|gif|jpe?g|png|webp|bmp|heic)(?:\?|\$)/i.test(video.link || '') ? 'image' : 'video';
        }

        function mediaMarkup(video, pinned = false) {
            const src = escapeHtml(video.link);
            const media = mediaType(video) === 'image'
                ? `<img class="aspect-[3/4] w-full object-cover" src="${src}" alt="${escapeHtml(video.description || '')}" loading="lazy">`
                : `<video class="aspect-[3/4] w-full object-cover" src="${src}" muted playsinline preload="metadata"></video>`;
            const pinIconHtml = pinned ? `<span class="absolute top-2 right-2 z-10 flex h-7 w-7 items-center justify-center rounded-full bg-rose-500 text-white shadow-md" title="Pinned post" aria-label="Pinned post"><i data-lucide="pin" class="h-3.5 w-3.5 fill-current"></i></span>` : '';

            return `<article class="group relative overflow-hidden bg-zinc-900 cursor-pointer" data-profile-video-id="${escapeHtml(video.id)}" tabindex="0" role="button" aria-label="Watch ${escapeHtml(video.description || 'post')}">
                ${media}
                ${pinIconHtml}
            </article>`;
        }

        function firestoreReadError(stage, error) {
            const code = typeof error?.code === 'string' ? error.code : 'unknown';
            if (code === 'permission-denied') {
                const ruleTarget = stage === 'published posts' ? 'published videos (`videos` where `admin` is "yes")'
                    : stage.startsWith('follow') ? 'follow records (`follows`)'
                    : 'public profiles (`profiles`)';
                return `Firestore denied the ${stage} read. Allow public reads of ${ruleTarget} in Firestore Security Rules.`;
            }
            if (code === 'failed-precondition') {
                return `Firestore needs an index to load ${stage}. Open the index-creation link in the browser console, create the suggested index, then reload.`;
            }
            const detail = typeof error?.message === 'string' ? error.message.trim().replace(/[.]+\$/, '') : '';
            const codeLabel = code === 'unknown' ? '' : ` (${code})`;
            return `Could not load ${stage}${codeLabel}${detail ? `: \${detail}` : ''}. Check your network and Firebase configuration, then try again.`;
        }

        async function readAtStage(stage, read) {
            try {
                return await read();
            } catch (error) {
                console.error(`Firestore ${stage} read failed:`, error);
                const wrapped = new Error(firestoreReadError(stage, error), { cause: error });
                wrapped.code = error?.code;
                wrapped.stage = stage;
                throw wrapped;
            }
        }

        async function loadUsersModal(type, userId) {
            const modal = document.getElementById('users-modal');
            const title = document.getElementById('users-modal-title');
            const list = document.getElementById('users-modal-list');
            
            title.textContent = type === 'followers' ? 'Followers' : 'Following';
            list.innerHTML = '<div class="py-12 text-center text-zinc-400"><i data-lucide="loader" class="h-8 w-8 animate-spin mx-auto text-rose-500 mb-2"></i><p class="text-sm">Loading…</p></div>';
            lucide.createIcons();
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                const followsSnap = await getDocs(query(
                    collection(db, 'follows'),
                    where(type === 'followers' ? 'followingId' : 'followerId', '==', userId)
                ));

                const targetField = type === 'followers' ? 'followerId' : 'followingId';
                const userIds = followsSnap.docs.map(docSnap => docSnap.data()[targetField]);

                if (userIds.length === 0) {
                    list.innerHTML = `<p class="py-8 text-center text-sm text-zinc-500">No ${type} yet.</p>`;
                    return;
                }

                const profiles = [];
                for (let i = 0; i < userIds.length; i += 10) {
                    const chunk = userIds.slice(i, i + 10);
                    const profilesSnap = await getDocs(query(collection(db, 'profiles'), where('__name__', 'in', chunk)));
                    const found = new Set();
                    profilesSnap.forEach(docSnap => {
                        found.add(docSnap.id);
                        profiles.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    for (const id of chunk) {
                        if (!found.has(id)) {
                            try {
                                const uSnap = await getDoc(doc(db, 'users', id));
                                if (uSnap.exists()) {
                                    const uData = uSnap.data();
                                    profiles.push({
                                        id,
                                        fullName: uData.fullName || uData.displayName || 'EarnTok user',
                                        username: uData.username || (uData.email ? uData.email.split('@')[0] : ''),
                                        profilePic: uData.profilePic || uData.photoURL || ''
                                    });
                                } else {
                                    profiles.push({
                                        id,
                                        fullName: 'EarnTok user',
                                        username: '',
                                        profilePic: ''
                                    });
                                }
                            } catch (e) {
                                console.error('Fallback fetch error:', e);
                            }
                        }
                    }
                }

                if (profiles.length === 0) {
                    list.innerHTML = `<p class="py-8 text-center text-sm text-zinc-500">No ${type} yet.</p>`;
                    return;
                }

                list.innerHTML = profiles.map(p => {
                    const handle = p.username ? `@${p.username}` : (p.email ? `@${p.email.split('@')[0]}` : `@user_${p.id.slice(0, 5)}`);
                    const name = p.fullName || 'EarnTok user';
                    const pic = p.profilePic || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80';
                    return `
                        <a href="./view-profile.html?uid=${encodeURIComponent(p.id)}" class="flex items-center gap-3 py-3 hover:bg-zinc-50 px-2 rounded-lg transition">
                            <img src="${escapeHtml(pic)}" class="h-10 w-10 min-w-[2.5rem] min-h-[2.5rem] max-w-[2.5rem] max-h-[2.5rem] shrink-0 rounded-full bg-zinc-200 object-cover" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80'" alt="">
                            <div class="min-w-0 flex-1">
                                <p class="truncate font-semibold text-sm text-zinc-900">${escapeHtml(name)}</p>
                                <p class="truncate text-xs text-zinc-500">${escapeHtml(handle)}</p>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (err) {
                console.error(`Error loading ${type}:`, err);
                list.innerHTML = `<p class="py-8 text-center text-sm text-rose-500">Failed to load ${type}.</p>`;
            }
        }

        async function load() {
            let profileDoc;
            let stage = 'profile';
            if (targetUid) {
                profileDoc = await readAtStage(stage, () => getDoc(doc(db, 'profiles', targetUid)));
            } else if (targetUsername) {
                const matches = await readAtStage(stage, () =>
                    getDocs(query(collection(db, 'profiles'), where('usernameLower', '==', targetUsername))));
                profileDoc = matches.docs[0] || null;
            } else {
                throw new Error('This profile link is missing its user ID.');
            }
            if (!profileDoc?.exists?.()) {
                document.getElementById('profile-name').textContent = 'Profile not found';
                document.getElementById('posts-grid').innerHTML = '<p class="col-span-full py-12 text-center text-zinc-500 bg-white">This profile is unavailable.</p>';
                return;
            }
            const userId = profileDoc.id;
            const profile = profileDoc.data();
            stage = 'published posts';
            const [authUser, postsSnapshot] = await Promise.all([
                getCurrentUser(),
                readAtStage(stage, () => getDocs(query(collection(db, 'videos'), where('admin', '==', 'yes'))))
            ]);
            const posts = postsSnapshot.docs
                .map(item => ({ id: item.id, ...item.data() }))
                .filter(post => post.userId === userId);
            stage = 'follow counts';
            let followStats = null;
            try {
                followStats = await getUserFollowStats(userId);
            } catch (error) {
                console.error('Unable to load profile follow counts:', error);
                document.getElementById('follower-count').textContent = '—';
                document.getElementById('following-count').textContent = '—';
                const message = document.getElementById('profile-load-message');
                message.textContent = firestoreReadError(stage, error);
                message.classList.remove('hidden');
            }
            const totalLikes = posts.reduce((total, post) => {
                const likes = Number(post.likesCount);
                return total + (Number.isFinite(likes) && likes > 0 ? Math.floor(likes) : 0);
            }, 0);
            const pinnedIds = Array.isArray(profile.pinnedVideos) ? profile.pinnedVideos : [];
            const pinned = pinnedIds.map(id => posts.find(post => post.id === id)).filter(Boolean);
            
            const pinnedSet = new Set(pinned.map(p => p.id));
            const unpinnedPosts = posts.filter(post => !pinnedSet.has(post.id));
            const combinedPosts = [...pinned, ...unpinnedPosts];

            document.getElementById('profile-name').textContent = profile.fullName || 'EarnTok user';
            document.getElementById('profile-username').textContent = profile.username ? `@${profile.username}` : '';
            document.getElementById('profile-verified').classList.toggle('hidden', profile.verify !== 'yes');
            document.getElementById('profile-bio').textContent = profile.bio || '';
            if (followStats) {
                document.getElementById('follower-count').textContent = formatCount(followStats.followers);
                document.getElementById('following-count').textContent = formatCount(followStats.following);
            }
            document.getElementById('like-count').textContent = formatCount(totalLikes);

            document.getElementById('follower-btn').addEventListener('click', () => loadUsersModal('followers', userId));
            document.getElementById('following-btn').addEventListener('click', () => loadUsersModal('following', userId));
            document.getElementById('users-modal-close').addEventListener('click', () => {
                document.getElementById('users-modal').classList.add('hidden');
                document.getElementById('users-modal').classList.remove('flex');
            });

            const followButton = document.getElementById('follow-button');
            const followMessage = document.getElementById('follow-message');
            const messageButton = document.getElementById('message-button');
            if (authUser?.uid !== userId) {
                followButton.classList.remove('hidden');
                messageButton.classList.remove('hidden');
                messageButton.href = `./message.html?uid=${encodeURIComponent(userId)}`;
                messageButton.addEventListener('click', event => {
                    if (!authUser) {
                        event.preventDefault();
                        const returnTo = `./message.html?uid=${encodeURIComponent(userId)}`;
                        location.href = `./oauth.html?returnTo=${encodeURIComponent(returnTo)}`;
                    }
                });
                lucide.createIcons();
                if (authUser) {
                    try {
                        const isFollowing = await isUserFollowing(authUser.uid, userId);
                        followButton.innerHTML = isFollowing
                            ? '<i data-lucide="user-check" class="mr-2 h-4 w-4" aria-hidden="true"></i>Following'
                            : '<i data-lucide="user-plus" class="mr-2 h-4 w-4" aria-hidden="true"></i>Follow';
                        lucide.createIcons();
                    } catch (error) {
                        console.error('Unable to load follow status:', error);
                        followMessage.textContent = firestoreReadError('follow status', error);
                        followMessage.classList.remove('hidden');
                    }
                }
                followButton.addEventListener('click', async () => {
                    if (!authUser) {
                        const returnTo = `${location.pathname}${location.search}`;
                        location.href = `./oauth.html?returnTo=${encodeURIComponent(returnTo)}`;
                        return;
                    }
                    followButton.disabled = true;
                    followMessage.classList.add('hidden');
                    try {
                        const isFollowing = await toggleUserFollow(authUser.uid, userId, { source: 'profile' });
                        followButton.innerHTML = isFollowing
                            ? '<i data-lucide="user-check" class="mr-2 h-4 w-4" aria-hidden="true"></i>Following'
                            : '<i data-lucide="user-plus" class="mr-2 h-4 w-4" aria-hidden="true"></i>Follow';
                        lucide.createIcons();
                        const updatedStats = await getUserFollowStats(userId);
                        document.getElementById('follower-count').textContent = formatCount(updatedStats.followers);
                    } catch (error) {
                        console.error('Unable to update follow status:', error);
                        followMessage.textContent = error.message || 'Could not update follow status. Please try again.';
                        followMessage.classList.remove('hidden');
                    } finally {
                        followButton.disabled = false;
                    }
                });
            }
            const avatar = document.getElementById('profile-pic');
            avatar.src = profile.profilePic || '';
            avatar.onerror = () => avatar.removeAttribute('src');

            document.getElementById('posts-grid').innerHTML = combinedPosts.length
                ? combinedPosts.map(post => mediaMarkup(post, pinnedSet.has(post.id))).join('')
                : '<p class="col-span-full py-12 text-center text-sm text-zinc-500 bg-white">No published posts yet.</p>';
            lucide.createIcons();
            
            const openProfileVideo = event => {
                const button = event.target.closest('[data-profile-video-id]');
                if (!button) return;
                const videoId = button.dataset.profileVideoId;
                videoViewer.open(combinedPosts.map(video => ({
                    ...video,
                    creatorUsername: profile.username ? `@${profile.username}` : profile.fullName,
                    creatorVerified: profile.verify === 'yes',
                    creatorAvatar: profile.profilePic || '',
                    creatorProfileHref: `./view-profile.html?uid=${encodeURIComponent(userId)}`
                })), videoId);
            };

            const postsGrid = document.getElementById('posts-grid');
            postsGrid.addEventListener('click', openProfileVideo);
            postsGrid.addEventListener('keydown', event => {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                event.preventDefault();
                openProfileVideo(event);
            });

            if (authUser?.uid !== userId) {
                try {
                    let viewerId = authUser?.uid;
                    if (!viewerId) {
                        let guestId = localStorage.getItem('earntok_guest_id');
                        if (!guestId) {
                            guestId = crypto.randomUUID();
                            localStorage.setItem('earntok_guest_id', guestId);
                        }
                        viewerId = `guest-${guestId}`;
                    }
                    await addDoc(collection(db, 'activity'), {
                        profileId: userId,
                        userId: viewerId,
                        action: 'profile_view',
                        details: {},
                        createdAt: serverTimestamp()
                    });
                } catch (error) {
                    console.error('Unable to record profile view:', error);
                }
            }
        }

        load().catch(error => {
            const failedStage = error?.stage || 'profile data';
            console.error(`Unable to load ${failedStage}:`, error);
            document.getElementById('profile-name').textContent = 'Could not load profile';
            const message = document.getElementById('profile-load-message');
            message.textContent = error?.stage ? error.message : firestoreReadError(failedStage, error);
            message.classList.remove('hidden');
            document.getElementById('posts-grid').innerHTML = '';
        });
    </script>
    <script type="module" src="./translator.js"></script>
</body>
</html>
