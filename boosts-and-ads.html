<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>EarnTok · Boost and Ads</title>
    <link rel="icon" type="image/png" href="./earntok-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { color-scheme: light; }
        body.bg-zinc-950 { background: #fff !important; color: #161823 !important; }
        .bg-zinc-950, .bg-zinc-950\/90 { background-color: #fff !important; }
        .bg-zinc-900, .bg-zinc-900\/90 { background-color: #f8f8fa !important; }
        .text-zinc-100 { color: #161823 !important; }
        .text-zinc-300 { color: #454550 !important; }
        .text-zinc-400, .text-zinc-500 { color: #777782 !important; }
        .border-zinc-800, .border-zinc-700 { border-color: #e4e4e8 !important; }
        .field { width: 100%; border: 1px solid #d8d8de; border-radius: .75rem; background: #fff; padding: .75rem .875rem; color: #161823; outline: none; }
        .field:focus { border-color: #fe2c55; box-shadow: 0 0 0 3px rgb(254 44 85 / 10%); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased">
    <header class="sticky top-0 z-20 border-b border-zinc-800 bg-zinc-950/90 backdrop-blur">
        <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
            <button type="button" data-history-back class="p-1" aria-label="Go back"><i data-lucide="arrow-left" class="h-6 w-6"></i></button>
            <h1 class="flex items-center gap-2 text-lg font-bold"><i data-lucide="coins" class="h-5 w-5 text-amber-400" aria-hidden="true"></i>Boost and Ads</h1>
            <a href="./wallet.html" class="text-sm font-semibold">Wallet</a>
        </div>
    </header>
    <main class="mx-auto max-w-3xl space-y-5 px-4 py-6 pb-12">
        <div class="rounded-2xl border border-zinc-200 bg-white p-5">
            <div class="flex items-start justify-between gap-3">
                <div><h2 class="text-xl font-bold">Promote your account</h2><p class="mt-1 text-sm text-zinc-500">Choose a promotion goal and submit a campaign request. Coins are charged from your available balance; approved campaigns are fulfilled by the EarnTok team.</p></div>
                <span class="rounded-full bg-zinc-100 px-3 py-1 text-xs font-bold text-zinc-600">Available to all users</span>
            </div>
            <p id="boost-message" class="mt-4 hidden rounded-xl border p-3 text-sm" role="status"></p>
            <p id="boost-balance" class="mt-4 flex items-center gap-1 text-sm font-semibold text-zinc-700"><i data-lucide="coins" class="h-4 w-4 text-amber-400" aria-hidden="true"></i><span>Available balance: — coins</span></p>
            <form id="boost-form" class="mt-5 space-y-4">
                <label class="block text-sm font-semibold">Promotion goal
                    <select id="boost-type" class="field mt-2" required>
                        <option value="likes">More likes on a video</option>
                        <option value="followers">More followers</option>
                        <option value="videoViews">More video views</option>
                        <option value="profileViews">More profile views</option>
                    </select>
                </label>
                <label id="boost-video-field" class="block text-sm font-semibold">Published video
                    <select id="boost-video" class="field mt-2" required></select>
                </label>
                <label class="block text-sm font-semibold">Units requested
                    <input id="boost-units" class="field mt-2" type="number" min="1" max="1000000" step="1" value="100" required>
                </label>
                <p id="boost-price" class="text-sm text-zinc-500"></p>
                <button id="boost-submit" class="w-full rounded-xl bg-rose-500 px-5 py-3 font-bold text-white hover:bg-rose-600 disabled:cursor-wait disabled:opacity-60" type="submit">Submit promotion request</button>
            </form>
        </div>
        <section>
            <h2 class="mb-3 text-lg font-bold">Your promotion requests</h2>
            <div id="boost-history" class="divide-y divide-zinc-100 rounded-2xl border border-zinc-200 bg-white"><p class="p-5 text-center text-sm text-zinc-500">Loading requests…</p></div>
        </section>
    </main>
    <script type="module">
        import { auth, db } from './firebase.js';
        import { enableHistoryBack } from './navigation.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import {
            collection, doc, getDoc, getDocs, limit, query, runTransaction, serverTimestamp, where
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        lucide.createIcons();
        enableHistoryBack();
        const typeSelect = document.getElementById('boost-type');
        const videoSelect = document.getElementById('boost-video');
        const message = document.getElementById('boost-message');
        const balanceLabel = document.getElementById('boost-balance');
        const prices = { likes: 0, followers: 0, videoViews: 0, profileViews: 0 };
        let user = null;
        let account = null;
        let videos = [];

        function showMessage(text, error = false) {
            message.textContent = text;
            message.className = `mt-4 rounded-xl border p-3 text-sm ${error ? 'border-rose-200 bg-rose-50 text-rose-700' : 'border-emerald-200 bg-emerald-50 text-emerald-700'}`;
        }
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }
        function formatCoins(value) { return Number(value || 0).toLocaleString(); }
        function selectedRate() { return prices[typeSelect.value] || 0; }
        function updateEstimate() {
            const units = Number(document.getElementById('boost-units').value);
            const rate = selectedRate();
            const cost = units * rate;
            document.getElementById('boost-price').innerHTML = Number.isSafeInteger(cost)
                ? `<i data-lucide="coins" class="inline h-4 w-4 text-amber-400 align-[-0.15em]" aria-hidden="true"></i> ${formatCoins(rate)} coins per unit · Total: ${formatCoins(cost)} coins`
                : 'The requested amount is too large.';
            lucide.createIcons();
        }
        function updateGoalFields() {
            const needsVideo = ['likes', 'videoViews'].includes(typeSelect.value);
            const videoField = document.getElementById('boost-video-field');
            videoField.classList.toggle('hidden', !needsVideo);
            videoSelect.required = needsVideo;
            updateEstimate();
        }
        async function loadHistory() {
            const container = document.getElementById('boost-history');
            try {
                const snapshot = await getDocs(query(collection(db, 'boostRequests'), where('userId', '==', user.uid), limit(50)));
                const rows = snapshot.docs.map(item => ({ id: item.id, ...item.data() }))
                    .sort((left, right) => (right.createdAt?.toMillis?.() || 0) - (left.createdAt?.toMillis?.() || 0));
                container.innerHTML = rows.length ? rows.map(item => `<article class="flex items-center justify-between gap-3 p-4">
                    <div><p class="font-semibold">${item.type === 'videoViews' ? 'Video views' : item.type === 'profileViews' ? 'Profile views' : item.type === 'followers' ? 'Followers' : 'Likes'} · ${formatCoins(item.units)} units</p><p class="mt-1 flex items-center gap-1 text-xs text-zinc-500"><i data-lucide="coins" class="h-3.5 w-3.5 text-amber-400" aria-hidden="true"></i>${formatCoins(item.coinsCost)} coins · ${escapeHtml(item.videoDescription || '')}</p></div>
                    <span class="rounded-full bg-zinc-100 px-3 py-1 text-xs font-semibold capitalize text-zinc-600">${escapeHtml(item.status || 'pending')}</span>
                </article>`).join('') : '<p class="p-5 text-center text-sm text-zinc-500">You have no promotion requests yet.</p>';
                lucide.createIcons();
            } catch (error) {
                console.error('Unable to load promotion history:', error);
                container.innerHTML = '<p class="p-5 text-center text-sm text-rose-600">Could not load your promotion requests.</p>';
            }
        }
        async function initialize(currentUser) {
            user = currentUser;
            try {
                const [accountSnapshot, settingsSnapshot, videosSnapshot] = await Promise.all([
                    getDoc(doc(db, 'users', user.uid)),
                    getDoc(doc(db, 'admin', 'boostSettings')),
                    getDocs(query(collection(db, 'videos'), where('userId', '==', user.uid)))
                ]);
                if (!accountSnapshot.exists()) throw new Error('Your account profile could not be found.');
                account = accountSnapshot.data();
                balanceLabel.querySelector('span').textContent = `Available balance: ${formatCoins(account.availableBalance)} coins`;
                if (settingsSnapshot.exists()) Object.assign(prices, settingsSnapshot.data());
                videos = videosSnapshot.docs
                    .filter(item => item.data().admin === 'yes')
                    .map(item => ({ id: item.id, ...item.data() }));
                videoSelect.innerHTML = videos.length
                    ? videos.map(item => `<option value="${item.id}">${String(item.description || 'Published video').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char])}</option>`).join('')
                    : '<option value="">No published videos found</option>';
                if (!videos.length) {
                    for (const option of typeSelect.options) {
                        if (['likes', 'videoViews'].includes(option.value)) option.disabled = true;
                    }
                    if (typeSelect.value === 'likes') typeSelect.value = 'followers';
                }
                updateGoalFields();
                await loadHistory();
            } catch (error) {
                console.error('Unable to load boost page:', error);
                showMessage(error.message || 'Could not load boost settings.', true);
                document.getElementById('boost-form').classList.add('hidden');
            }
        }
        typeSelect.addEventListener('change', updateGoalFields);
        document.getElementById('boost-units').addEventListener('input', updateEstimate);
        document.getElementById('boost-form').addEventListener('submit', async event => {
            event.preventDefault();
            if (!user || !account) return;
            const button = document.getElementById('boost-submit');
            const type = typeSelect.value;
            const units = Number(document.getElementById('boost-units').value);
            const rate = selectedRate();
            const cost = units * rate;
            const selectedVideo = ['likes', 'videoViews'].includes(type)
                ? videos.find(item => item.id === videoSelect.value)
                : null;
            if (!Number.isSafeInteger(units) || units < 1 || units > 1000000 || !Number.isSafeInteger(cost) || cost < 1) {
                showMessage('Choose a valid number of units and make sure the promotion price is configured.', true);
                return;
            }
            if (['likes', 'videoViews'].includes(type) && !selectedVideo) {
                showMessage('Select one of your published videos to promote.', true);
                return;
            }
            button.disabled = true;
            try {
                const requestRef = doc(collection(db, 'boostRequests'));
                const activityRef = doc(collection(db, 'activities'));
                const userRef = doc(db, 'users', user.uid);
                const settingsRef = doc(db, 'admin', 'boostSettings');
                await runTransaction(db, async transaction => {
                    const [userSnapshot, settingsSnapshot] = await Promise.all([
                        transaction.get(userRef),
                        transaction.get(settingsRef)
                    ]);
                    if (!userSnapshot.exists()) throw new Error('Your account profile could not be found.');
                    const currentSettings = settingsSnapshot.exists() ? settingsSnapshot.data() : {};
                    const currentRate = Number(currentSettings[type] ?? 0);
                    if (!Number.isSafeInteger(currentRate) || currentRate < 1 || currentRate !== rate) {
                        throw new Error('Promotion pricing changed or is not configured. Refresh this page and try again.');
                    }
                    if (selectedVideo) {
                        const videoSnapshot = await transaction.get(doc(db, 'videos', selectedVideo.id));
                        if (!videoSnapshot.exists() || videoSnapshot.data().admin !== 'yes' || videoSnapshot.data().userId !== user.uid) {
                            throw new Error('The selected video is no longer published on your account.');
                        }
                    }
                    const availableBalance = Number(userSnapshot.data().availableBalance ?? 0);
                    if (!Number.isSafeInteger(availableBalance) || availableBalance < cost) {
                        throw new Error('Your available balance is too low for this promotion.');
                    }
                    transaction.update(userRef, { availableBalance: availableBalance - cost });
                    transaction.set(requestRef, {
                        userId: user.uid,
                        type,
                        units,
                        coinsCost: cost,
                        videoId: selectedVideo?.id || '',
                        videoDescription: selectedVideo?.description || '',
                        status: 'pending',
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    });
                    transaction.set(activityRef, {
                        userId: 'system',
                        profileId: user.uid,
                        action: 'boost_request',
                        details: { requestId: requestRef.id, promotionType: type, units, amount: cost, currency: 'coins', status: 'pending' },
                        createdAt: serverTimestamp()
                    });
                });
                account.availableBalance -= cost;
                balanceLabel.querySelector('span').textContent = `Available balance: ${formatCoins(account.availableBalance)} coins`;
                showMessage('Promotion request submitted. Coins are reserved while it is reviewed.');
                await loadHistory();
            } catch (error) {
                console.error('Unable to submit promotion request:', error);
                showMessage(error.message || 'Could not submit your promotion request.', true);
            } finally {
                button.disabled = false;
            }
        });
        onAuthStateChanged(auth, currentUser => {
            if (!currentUser) {
                location.href = `./oauth.html?returnTo=${encodeURIComponent(location.pathname + location.search)}`;
                return;
            }
            initialize(currentUser);
        }, error => {
            console.error('Unable to check sign-in state:', error);
            showMessage('Could not verify your sign-in status. Please reload.', true);
        });
    </script>
</body>
</html>
