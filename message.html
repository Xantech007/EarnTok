<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>EarnTok · Direct Message</title>
    <link rel="icon" type="image/png" href="./earntok-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { color-scheme: light; }
        html, body { height: 100%; height: 100dvh; overflow: hidden; }
        body.bg-zinc-950 { background: #fff !important; color: #161823 !important; }
        .bg-zinc-950, .bg-zinc-950\/90 { background-color: #fff !important; }
        .bg-zinc-900, .bg-zinc-900\/90, .bg-zinc-900\/70, .bg-zinc-900\/50 { background-color: #f8f8fa !important; }
        .bg-zinc-800 { background-color: #f1f1f2 !important; }
        .text-zinc-100 { color: #161823 !important; }
        .text-zinc-300 { color: #454550 !important; }
        .text-zinc-400, .text-zinc-500, .text-zinc-600 { color: #777782 !important; }
        .border-zinc-800, .border-zinc-700 { border-color: #e4e4e8 !important; }
        .text-sky-400 { color: #0284c7 !important; }
        img.rounded-full, .avatar-img {
            object-fit: cover !important;
            aspect-ratio: 1 / 1 !important;
        }
        .messages-scroll::-webkit-scrollbar { width: 5px; }
        .messages-scroll::-webkit-scrollbar-track { background: transparent; }
        .messages-scroll::-webkit-scrollbar-thumb { background: #e4e4e8; border-radius: 9999px; }
        #message-actions-modal::backdrop { background: rgba(0, 0, 0, .38); }
        .message-bubble { width: fit-content; max-width: min(78vw, 34rem); overflow-wrap: anywhere; }
        .message-reactions { width: fit-content; }
        .message-media { max-height: min(55dvh, 30rem); max-width: min(78vw, 34rem); }
        .message-audio { width: min(72vw, 20rem); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased flex flex-col h-full select-text">
    <!-- Header -->
    <header class="sticky top-0 z-30 shrink-0 border-b border-zinc-200 bg-white/95 backdrop-blur px-4 py-2.5">
        <div class="mx-auto flex max-w-3xl items-center justify-between">
            <div class="flex items-center gap-3 min-w-0">
                <button type="button" data-history-back id="message-inbox-link" class="relative text-zinc-900 hover:opacity-80 p-1 shrink-0" aria-label="Go back">
                    <i data-lucide="arrow-left" class="h-6 w-6 stroke-[2.5]" aria-hidden="true"></i>
                    <span data-unread-message-badge class="absolute -right-1 -top-1 hidden min-w-4 h-4 items-center justify-center rounded-full bg-rose-500 px-1 text-[10px] font-bold leading-none text-white" aria-hidden="true"></span>
                </button>
                <a id="header-profile-link" href="#" class="flex items-center gap-2.5 min-w-0 hover:opacity-85 transition">
                    <img id="header-avatar" class="h-9 w-9 min-w-[2.25rem] min-h-[2.25rem] max-w-[2.25rem] max-h-[2.25rem] rounded-full bg-zinc-200 object-cover shrink-0 border border-zinc-200" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80" alt="Avatar">
                    <div class="min-w-0">
                        <div class="flex items-center gap-1">
                            <span id="header-name" class="font-bold text-sm text-zinc-900 truncate">Loading…</span>
                            <i id="header-verified" data-lucide="badge-check" class="hidden h-3.5 w-3.5 shrink-0 text-sky-400"></i>
                        </div>
                        <p id="header-username" class="text-xs text-zinc-400 truncate"></p>
                    </div>
                </a>
            </div>
            <a id="header-profile-btn" href="#" class="rounded-full p-2 text-zinc-600 hover:bg-zinc-100 transition shrink-0" title="View Profile" aria-label="View Profile">
                <i data-lucide="user" class="h-5 w-5"></i>
            </a>
        </div>
    </header>

    <!-- Chat Error Banner -->
    <div id="chat-error" class="hidden mx-auto max-w-3xl w-full px-4 pt-3">
        <div class="rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm text-rose-600 flex items-center justify-between">
            <span id="chat-error-text">Unable to load messages.</span>
            <button type="button" data-history-back class="underline font-semibold ml-2">Go back</button>
        </div>
    </div>

    <!-- Messages Container -->
    <main id="messages-container" class="messages-scroll mx-auto w-full max-w-3xl flex-1 overflow-y-auto px-4 py-4 space-y-4">
        <!-- Target Profile Summary Card (template-style from view-profile.html) -->
        <section id="chat-profile-card" class="flex flex-col items-center py-6 border-b border-zinc-100 text-center">
            <img id="card-pic" class="h-20 w-20 min-w-[5rem] min-h-[5rem] max-w-[5rem] max-h-[5rem] rounded-full bg-zinc-200 object-cover shadow-sm mb-3 shrink-0" alt="Profile picture">
            <h2 id="card-name" class="font-bold text-xl text-zinc-900 flex items-center gap-1.5 justify-center">
                <span>Loading…</span>
                <i id="card-verified" data-lucide="badge-check" class="hidden h-4 w-4 text-sky-400"></i>
            </h2>
            <p id="card-username" class="text-sm text-zinc-400 mt-0.5"></p>
            <p id="card-bio" class="text-xs text-zinc-600 max-w-md mt-2 whitespace-pre-wrap"></p>
            <a id="card-profile-btn" href="#" class="mt-3.5 inline-flex items-center gap-1.5 rounded-full bg-zinc-100 px-4 py-1.5 text-xs font-bold text-zinc-800 hover:bg-zinc-200 border border-zinc-200 transition">
                <i data-lucide="external-link" class="h-3.5 w-3.5"></i> View profile
            </a>
            <p class="text-[11px] text-zinc-400 mt-4 tracking-wide">Beginning of direct messages</p>
        </section>

        <!-- Message List -->
        <div id="messages-list" class="space-y-3 pt-2">
            <div id="messages-loading" class="py-16 text-center text-zinc-400">
                <i data-lucide="loader" class="h-8 w-8 animate-spin mx-auto text-rose-500 mb-2"></i>
                <p class="text-sm">Loading messages…</p>
            </div>
        </div>
    </main>

    <!-- Message Input Bar -->
    <footer class="sticky bottom-0 z-30 shrink-0 border-t border-zinc-200 bg-white/95 backdrop-blur px-4 py-2.5 pb-[max(.65rem,env(safe-area-inset-bottom))]">
        <p id="composer-status" class="mx-auto mb-2 hidden max-w-3xl text-xs text-zinc-500" role="status"></p>
        <form id="message-form" class="mx-auto flex max-w-3xl items-center gap-2" autocomplete="off">
            <input id="attachment-input" type="file" accept="image/*,video/*" class="hidden" aria-label="Choose an image or video">
            <button id="attachment-button" type="button" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-zinc-600 hover:bg-zinc-100 disabled:opacity-40" aria-label="Attach image or video" title="Attach image or video" disabled>
                <i data-lucide="paperclip" class="h-5 w-5" aria-hidden="true"></i>
            </button>
            <input
                id="message-input"
                type="text"
                placeholder="Send a message…"
                maxlength="2000"
                class="flex-1 rounded-full bg-zinc-100 border border-zinc-200 px-4 py-2.5 text-sm text-zinc-900 placeholder:text-zinc-400 outline-none focus:border-rose-500 focus:bg-white transition"
                disabled
            >
            <button id="voice-note-button" type="button" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-zinc-600 hover:bg-zinc-100 disabled:opacity-40" aria-label="Record voice note" title="Record voice note" disabled>
                <i data-lucide="mic" class="h-5 w-5" aria-hidden="true"></i>
            </button>
            <button
                id="send-button"
                type="submit"
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-rose-500 text-white hover:bg-rose-600 disabled:opacity-40 disabled:cursor-not-allowed transition shadow-sm"
                disabled
                aria-label="Send message"
            >
                <i data-lucide="send" class="h-4 w-4"></i>
            </button>
        </form>
    </footer>

    <dialog id="message-actions-modal" aria-label="Message actions" class="m-auto w-[min(22rem,calc(100vw-2rem))] overflow-visible rounded-2xl border-0 bg-white p-0 text-zinc-900 shadow-2xl">
        <div id="message-actions-content" class="p-4"></div>
    </dialog>

    <script type="module">
        import { auth, db } from './firebase.js';
        import { enableHistoryBack } from './navigation.js';
        import { subscribeToUnreadMessages } from './unread-messages.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import {
            collection, doc, getDoc, setDoc, addDoc, updateDoc,
            onSnapshot, serverTimestamp, runTransaction
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        lucide.createIcons();
        enableHistoryBack();

        const params = new URLSearchParams(location.search);
        const targetUid = params.get('uid');

        const headerProfileLink = document.getElementById('header-profile-link');
        const headerProfileBtn = document.getElementById('header-profile-btn');
        const headerAvatar = document.getElementById('header-avatar');
        const headerName = document.getElementById('header-name');
        const headerVerified = document.getElementById('header-verified');
        const headerUsername = document.getElementById('header-username');

        const cardPic = document.getElementById('card-pic');
        const cardName = document.getElementById('card-name');
        const cardVerified = document.getElementById('card-verified');
        const cardUsername = document.getElementById('card-username');
        const cardBio = document.getElementById('card-bio');
        const cardProfileBtn = document.getElementById('card-profile-btn');

        const messagesContainer = document.getElementById('messages-container');
        const messagesList = document.getElementById('messages-list');
        const messagesLoading = document.getElementById('messages-loading');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const attachmentInput = document.getElementById('attachment-input');
        const attachmentButton = document.getElementById('attachment-button');
        const voiceNoteButton = document.getElementById('voice-note-button');
        const composerStatus = document.getElementById('composer-status');
        const chatError = document.getElementById('chat-error');
        const chatErrorText = document.getElementById('chat-error-text');
        const messageActionsModal = document.getElementById('message-actions-modal');
        const messageActionsContent = document.getElementById('message-actions-content');

        const defaultAvatar = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80';

        let currentUser = null;
        let currentUserProfile = null;
        let targetProfile = null;
        let unsubscribeMessages = null;
        let unsubscribeChatDoc = null;
        let unsubscribeUnreadMessages = null;
        let chatId = null;
        let currentMessages = [];
        let selectedMessage = null;
        let pressTimer = null;
        let pressStart = null;
        let suppressNextMessageClick = false;
        let selectedMedia = null;
        let mediaRecorder = null;
        let recordingStream = null;
        let recordingChunks = [];

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&#38;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function formatMessageTime(timestamp) {
            if (!timestamp) return 'Just now';
            let date;
            if (typeof timestamp.toDate === 'function') {
                date = timestamp.toDate();
            } else if (timestamp instanceof Date) {
                date = timestamp;
            } else if (typeof timestamp === 'number') {
                date = new Date(timestamp);
            } else {
                return 'Just now';
            }

            const now = new Date();
            const isToday = now.toDateString() === date.toDateString();
            const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (isToday) return timeStr;
            return `${date.toLocaleDateString([], { month: 'short', day: 'numeric' })}, ${timeStr}`;
        }

        function scrollToBottom(smooth = false) {
            requestAnimationFrame(() => {
                messagesContainer.scrollTo({
                    top: messagesContainer.scrollHeight,
                    behavior: smooth ? 'smooth' : 'auto'
                });
            });
        }

        function showChatError(message) {
            chatErrorText.textContent = message;
            chatError.classList.remove('hidden');
        }

        async function loadProfiles() {
            if (!targetUid) {
                showChatError('No user specified for this chat.');
                return false;
            }

            if (currentUser.uid === targetUid) {
                showChatError('You cannot chat with yourself.');
                messageInput.disabled = true;
                sendButton.disabled = true;
                return false;
            }

            try {
                // Fetch current user's profile
                const [myProfSnap, targetProfSnap] = await Promise.all([
                    getDoc(doc(db, 'profiles', currentUser.uid)),
                    getDoc(doc(db, 'profiles', targetUid))
                ]);

                currentUserProfile = myProfSnap.exists() ? myProfSnap.data() : {
                    fullName: currentUser.displayName || 'EarnTok user',
                    username: '',
                    profilePic: currentUser.photoURL || '',
                    verify: 'no'
                };

                if (targetProfSnap.exists()) {
                    targetProfile = { id: targetProfSnap.id, ...targetProfSnap.data() };
                } else {
                    // Fallback to users collection
                    const userSnap = await getDoc(doc(db, 'users', targetUid));
                    if (userSnap.exists()) {
                        targetProfile = { id: userSnap.id, ...userSnap.data() };
                    } else {
                        targetProfile = {
                            id: targetUid,
                            fullName: 'EarnTok user',
                            username: '',
                            profilePic: '',
                            bio: '',
                            verify: 'no'
                        };
                    }
                }

                // Populate Header
                const targetName = targetProfile.fullName || 'EarnTok user';
                const targetHandle = targetProfile.username ? `@${targetProfile.username}` : '';
                const targetPic = targetProfile.profilePic || defaultAvatar;
                const isVerified = targetProfile.verify === 'yes';

                document.title = `EarnTok · Chat with ${targetName}`;
                headerName.textContent = targetName;
                headerUsername.textContent = targetHandle;
                headerAvatar.src = targetPic;
                headerAvatar.onerror = () => { headerAvatar.src = defaultAvatar; };
                headerVerified.classList.toggle('hidden', !isVerified);

                const profileUrl = `./view-profile.html?uid=${encodeURIComponent(targetUid)}`;
                headerProfileLink.href = profileUrl;
                headerProfileBtn.href = profileUrl;

                // Populate Summary Card
                cardName.querySelector('span').textContent = targetName;
                cardUsername.textContent = targetHandle;
                cardPic.src = targetPic;
                cardPic.onerror = () => { cardPic.src = defaultAvatar; };
                cardVerified.classList.toggle('hidden', !isVerified);
                cardBio.textContent = targetProfile.bio || '';
                cardProfileBtn.href = profileUrl;

                lucide.createIcons();

                // Enable input
                messageInput.disabled = false;
                attachmentButton.disabled = false;
                voiceNoteButton.disabled = false;
                messageInput.focus();

                return true;
            } catch (err) {
                console.error('Failed to load profiles for chat:', err);
                showChatError('Could not load user profile. Check your connection.');
                return false;
            }
        }

        async function markAsRead() {
            if (!chatId || !currentUser) return;
            try {
                const chatRef = doc(db, 'chats', chatId);
                const chatSnap = await getDoc(chatRef);
                if (chatSnap.exists()) {
                    const data = chatSnap.data();
                    if (Array.isArray(data.unreadBy) && data.unreadBy.includes(currentUser.uid)) {
                        const updatedUnread = data.unreadBy.filter(id => id !== currentUser.uid);
                        await updateDoc(chatRef, { unreadBy: updatedUnread });
                    }
                }
            } catch (err) {
                console.warn('Could not mark chat as read:', err);
            }
        }

        function renderMessageContent(message) {
            const mediaUrl = typeof message.mediaUrl === 'string' ? message.mediaUrl : '';
            let content = '';
            if (mediaUrl && message.type === 'image') {
                content = `<img src="${escapeHtml(mediaUrl)}" alt="${escapeHtml(message.fileName || 'Shared image')}" class="message-media rounded-xl object-contain" loading="lazy">`;
            } else if (mediaUrl && message.type === 'video') {
                content = `<video src="${escapeHtml(mediaUrl)}" class="message-media rounded-xl" controls playsinline preload="metadata"></video>`;
            } else if (mediaUrl && message.type === 'audio') {
                content = `<audio src="${escapeHtml(mediaUrl)}" class="message-audio" controls preload="metadata"></audio>`;
            }
            const text = message.text
                ? `<p class="${content ? 'mt-2' : ''} whitespace-pre-wrap break-words">${escapeHtml(message.text)}</p>`
                : '';
            return `${content}${text}`;
        }

        function messagePreview(message) {
            if (!message) return '';
            if (message.type === 'audio') return '🎤 Voice note';
            if (message.type === 'image') return '📷 Photo';
            if (message.type === 'video') return '🎥 Video';
            return message.text || '';
        }

        function renderMessages(messages) {
            currentMessages = messages;
            if (messages.length === 0) {
                messagesList.innerHTML = `
                    <div class="py-8 text-center text-zinc-400">
                        <p class="text-xs">No messages yet. Say hello to ${escapeHtml(targetProfile.fullName || 'this creator')}! 👋</p>
                    </div>
                `;
                return;
            }

            const targetPic = targetProfile.profilePic || defaultAvatar;

            messagesList.innerHTML = messages.map(msg => {
                const isMine = msg.senderId === currentUser.uid;
                const timeStr = formatMessageTime(msg.createdAt);
                const bubbleClasses = `message-bubble rounded-2xl px-3.5 py-2 text-sm leading-5 whitespace-pre-wrap break-words select-text ${isMine ? 'rounded-br-sm bg-rose-500 text-white' : 'rounded-bl-sm border border-zinc-200 bg-zinc-100 text-zinc-900'}`;
                const reactionSummary = renderReactionSummary(msg.reactions, currentUser.uid);
                const messageContent = renderMessageContent(msg);
                const messageLabel = msg.type === 'audio' ? 'Voice note'
                    : msg.type === 'video' ? 'Video'
                        : msg.type === 'image' ? 'Image'
                            : msg.text;

                if (isMine) {
                    return `
                        <div class="message-row mb-2.5 flex flex-col items-end" data-message-id="${escapeHtml(msg.id)}">
                            <div class="${bubbleClasses} message-bubble-button shadow-sm" data-message-id="${escapeHtml(msg.id)}" aria-label="${escapeHtml(messageLabel)}. Hold for message options.">${messageContent}</div>
                            ${reactionSummary}
                            <span class="mr-1 mt-1 text-[10px] text-zinc-400">${escapeHtml(timeStr)}${msg.edited ? ' · edited' : ''}</span>
                        </div>
                    `;
                }

                return `
                    <div class="message-row mb-2.5 flex items-end gap-2" data-message-id="${escapeHtml(msg.id)}">
                        <img src="${escapeHtml(targetPic)}" class="mb-4 h-7 w-7 min-w-[1.75rem] min-h-[1.75rem] max-w-[1.75rem] max-h-[1.75rem] shrink-0 rounded-full bg-zinc-200 object-cover" onerror="this.src='${defaultAvatar}'" alt="">
                        <div class="flex max-w-[78%] flex-col items-start">
                            <div class="${bubbleClasses} message-bubble-button shadow-sm" data-message-id="${escapeHtml(msg.id)}" aria-label="${escapeHtml(messageLabel)}. Hold for message options.">${messageContent}</div>
                            ${reactionSummary}
                            <span class="ml-1 mt-1 text-[10px] text-zinc-400">${escapeHtml(timeStr)}${msg.edited ? ' · edited' : ''}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function subscribeToMessages() {
            chatId = [currentUser.uid, targetUid].sort().join('_');

            // Listen to messages subcollection
            const messagesRef = collection(db, 'chats', chatId, 'messages');
            unsubscribeMessages = onSnapshot(messagesRef, snapshot => {
                messagesLoading?.remove();
                const msgs = snapshot.docs.map(docSnap => ({
                    id: docSnap.id,
                    ...docSnap.data()
                }));

                // Safe client-side sorting by creation time
                msgs.sort((a, b) => {
                    const timeA = a.createdAt?.toMillis?.() || (a.createdAt instanceof Date ? a.createdAt.getTime() : 0);
                    const timeB = b.createdAt?.toMillis?.() || (b.createdAt instanceof Date ? b.createdAt.getTime() : 0);
                    return timeA - timeB;
                });

                renderMessages(msgs);
                scrollToBottom(false);
                markAsRead();
            }, error => {
                console.error('Error listening to messages:', error);
                showChatError('Unable to sync messages in real-time.');
            });
        }

        async function handleSendMessage(event) {
            event.preventDefault();
            const text = messageInput.value.trim();
            if ((!text && !selectedMedia) || !currentUser || !targetUid) return;

            messageInput.disabled = true;
            sendButton.disabled = true;
            attachmentButton.disabled = true;
            voiceNoteButton.disabled = true;

            try {
                let uploadedMedia = null;
                if (selectedMedia) {
                    composerStatus.textContent = `Uploading ${selectedMedia.type.startsWith('audio/') ? 'voice note' : selectedMedia.type.startsWith('image/') ? 'image' : 'video'}…`;
                    composerStatus.classList.remove('hidden');
                    uploadedMedia = await uploadMessageMedia(selectedMedia);
                }
                const type = uploadedMedia?.type || 'text';
                const messageSummary = messagePreview({ type, text });
                // 1. Add message document to chats/{chatId}/messages
                const messagesRef = collection(db, 'chats', chatId, 'messages');
                const newMessageRef = await addDoc(messagesRef, {
                    chatId,
                    senderId: currentUser.uid,
                    receiverId: targetUid,
                    text,
                    ...(uploadedMedia ? {
                        type,
                        mediaUrl: uploadedMedia.url,
                        fileName: uploadedMedia.fileName,
                        contentType: uploadedMedia.contentType
                    } : {}),
                    createdAt: serverTimestamp(),
                    read: false
                });

                // 2. Set/merge conversation in chats/{chatId}
                const chatDocRef = doc(db, 'chats', chatId);
                await setDoc(chatDocRef, {
                    id: chatId,
                    participants: [currentUser.uid, targetUid],
                    lastMessage: messageSummary,
                    lastMessageId: newMessageRef.id,
                    lastSenderId: currentUser.uid,
                    updatedAt: serverTimestamp(),
                    unreadBy: [targetUid],
                    participantData: {
                        [currentUser.uid]: {
                            uid: currentUser.uid,
                            fullName: currentUserProfile.fullName || currentUser.displayName || 'EarnTok user',
                            username: currentUserProfile.username || '',
                            profilePic: currentUserProfile.profilePic || currentUser.photoURL || '',
                            verify: currentUserProfile.verify || 'no'
                        },
                        [targetUid]: {
                            uid: targetUid,
                            fullName: targetProfile.fullName || 'EarnTok user',
                            username: targetProfile.username || '',
                            profilePic: targetProfile.profilePic || '',
                            verify: targetProfile.verify || 'no'
                        }
                    }
                }, { merge: true });

                messageInput.value = '';
                selectedMedia = null;
                attachmentInput.value = '';
                composerStatus.textContent = '';
                composerStatus.classList.add('hidden');
                scrollToBottom(true);
            } catch (err) {
                console.error('Failed to send message:', err);
                composerStatus.textContent = err.message || 'Could not send the message. Please check your connection and try again.';
                composerStatus.classList.remove('hidden');
            } finally {
                messageInput.disabled = false;
                attachmentButton.disabled = false;
                voiceNoteButton.disabled = false;
                updateSendButton();
                messageInput.focus();
            }
        }

        function updateSendButton() {
            sendButton.disabled = !messageInput.value.trim() && !selectedMedia;
        }

        function uploadMessageMedia(file) {
            const type = file.type.startsWith('audio/') ? 'audio'
                : file.type.startsWith('image/') ? 'image'
                    : file.type.startsWith('video/') ? 'video' : null;
            if (!type) return Promise.reject(new Error('Choose an image, video, or voice note.'));
            const resourceType = type === 'image' ? 'image' : 'video';
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'pending_review');
            const cloudName = 'hjkjnzpz';
            const endpoint = `https://api.cloudinary.com/v1_1/${cloudName}/${resourceType}/upload`;
            return new Promise((resolve, reject) => {
                const request = new XMLHttpRequest();
                request.open('POST', endpoint);
                request.upload.addEventListener('progress', event => {
                    if (event.lengthComputable) {
                        composerStatus.textContent = `Uploading… ${Math.round(event.loaded / event.total * 100)}%`;
                    }
                });
                request.addEventListener('load', () => {
                    let response;
                    try {
                        response = JSON.parse(request.responseText);
                    } catch {
                        reject(new Error('Cloudinary returned an unreadable upload response.'));
                        return;
                    }
                    if (request.status < 200 || request.status >= 300 || !response.secure_url) {
                        reject(new Error(response.error?.message || `Media upload failed (${request.status}).`));
                        return;
                    }
                    resolve({
                        url: response.secure_url,
                        type,
                        fileName: file.name || (type === 'audio' ? 'Voice note' : type === 'image' ? 'Photo' : 'Video'),
                        contentType: file.type
                    });
                });
                request.addEventListener('error', () => reject(new Error('Network error while uploading media.')));
                request.addEventListener('abort', () => reject(new Error('Media upload was cancelled.')));
                request.send(formData);
            });
        }

        function setSelectedMedia(file) {
            selectedMedia = file;
            composerStatus.textContent = `${file.type.startsWith('audio/') ? 'Voice note' : file.type.startsWith('image/') ? 'Photo' : 'Video'} ready to send${file.name ? ` · ${file.name}` : ''}`;
            composerStatus.classList.remove('hidden');
            updateSendButton();
        }

        function stopRecordingStream() {
            recordingStream?.getTracks().forEach(track => track.stop());
            recordingStream = null;
        }

        async function toggleVoiceNoteRecording() {
            if (mediaRecorder?.state === 'recording') {
                mediaRecorder.stop();
                voiceNoteButton.innerHTML = '<i data-lucide="mic" class="h-5 w-5" aria-hidden="true"></i>';
                voiceNoteButton.setAttribute('aria-label', 'Record voice note');
                voiceNoteButton.classList.remove('text-rose-600', 'bg-rose-50');
                lucide.createIcons();
                return;
            }
            if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
                composerStatus.textContent = 'Voice recording is not supported in this browser.';
                composerStatus.classList.remove('hidden');
                return;
            }
            try {
                recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4']
                    .find(type => MediaRecorder.isTypeSupported(type));
                mediaRecorder = mimeType
                    ? new MediaRecorder(recordingStream, { mimeType })
                    : new MediaRecorder(recordingStream);
                recordingChunks = [];
                mediaRecorder.addEventListener('dataavailable', event => {
                    if (event.data.size) recordingChunks.push(event.data);
                });
                mediaRecorder.addEventListener('stop', () => {
                    stopRecordingStream();
                    if (recordingChunks.length) {
                        const blob = new Blob(recordingChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                        const extension = blob.type.includes('mp4') ? 'm4a' : 'webm';
                        setSelectedMedia(new File([blob], `voice-note-${Date.now()}.${extension}`, { type: blob.type }));
                    }
                }, { once: true });
                mediaRecorder.start();
                composerStatus.textContent = 'Recording voice note… Tap the microphone again to finish.';
                composerStatus.classList.remove('hidden');
                voiceNoteButton.innerHTML = '<i data-lucide="square" class="h-4 w-4 fill-current" aria-hidden="true"></i>';
                voiceNoteButton.setAttribute('aria-label', 'Stop recording');
                voiceNoteButton.classList.add('text-rose-600', 'bg-rose-50');
                lucide.createIcons();
            } catch (error) {
                stopRecordingStream();
                console.error('Could not record a voice note:', error);
                composerStatus.textContent = error.name === 'NotAllowedError'
                    ? 'Microphone access was denied. Allow microphone access to record a voice note.'
                    : error.message || 'Could not start voice recording.';
                composerStatus.classList.remove('hidden');
            }
        }

        messageInput.addEventListener('input', updateSendButton);
        attachmentButton.addEventListener('click', () => attachmentInput.click());
        attachmentInput.addEventListener('change', () => {
            const [file] = attachmentInput.files || [];
            if (!file) return;
            if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
                composerStatus.textContent = 'Choose an image or video file.';
                composerStatus.classList.remove('hidden');
                attachmentInput.value = '';
                return;
            }
            setSelectedMedia(file);
        });
        voiceNoteButton.addEventListener('click', toggleVoiceNoteRecording);

        messageForm.addEventListener('submit', handleSendMessage);

        function renderReactionSummary(reactions = {}, uid) {
            if (!reactions || typeof reactions !== 'object') return '';
            const grouped = new Map();
            for (const [reactorId, emoji] of Object.entries(reactions)) {
                if (typeof emoji !== 'string' || !emoji) continue;
                const group = grouped.get(emoji) || { count: 0, mine: false };
                group.count += 1;
                group.mine ||= reactorId === uid;
                grouped.set(emoji, group);
            }
            if (!grouped.size) return '';
            return `<span class="message-reactions -mt-1 inline-flex flex-wrap gap-1 rounded-full border border-zinc-200 bg-white px-1.5 py-0.5 shadow-sm">${[...grouped].map(([emoji, group]) =>
                `<span class="text-xs ${group.mine ? 'font-bold text-rose-600' : 'text-zinc-700'}" aria-label="${group.count} ${emoji} reaction${group.count === 1 ? '' : 's'}">${escapeHtml(emoji)}${group.count > 1 ? ` ${group.count}` : ''}</span>`
            ).join('')}</span>`;
        }

        function stopLongPress() {
            clearTimeout(pressTimer);
            pressTimer = null;
            pressStart = null;
        }

        function openMessageActions(messageId) {
            selectedMessage = currentMessages.find(message => message.id === messageId);
            if (!selectedMessage) return;
            renderMessageActions();
            lucide.createIcons();
            if (!messageActionsModal.open) messageActionsModal.showModal();
        }

        function renderMessageActions() {
            const ownerActions = selectedMessage?.senderId === currentUser.uid
                ? `<div class="mt-3 border-t border-zinc-100 pt-2">
                    ${!selectedMessage.type || selectedMessage.type === 'text' ? `<button type="button" data-message-action="edit" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm font-medium hover:bg-zinc-50">
                        <i data-lucide="pencil" class="h-4 w-4 text-zinc-500" aria-hidden="true"></i>Edit message
                    </button>` : ''}
                    <button type="button" data-message-action="delete" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm font-medium text-rose-600 hover:bg-rose-50">
                        <i data-lucide="trash-2" class="h-4 w-4" aria-hidden="true"></i>Delete message
                    </button>
                </div>`
                : '';
            messageActionsContent.innerHTML = `
                <p class="mb-3 text-center text-xs font-semibold uppercase tracking-wide text-zinc-400">React to message</p>
                <div class="flex items-center justify-center gap-1.5">
                    <button type="button" class="reaction-choice rounded-full p-2 text-2xl transition hover:bg-zinc-100 active:scale-90" data-reaction="❤️" aria-label="React with heart">❤️</button>
                    <button type="button" class="reaction-choice rounded-full p-2 text-2xl transition hover:bg-zinc-100 active:scale-90" data-reaction="😂" aria-label="React with laughter">😂</button>
                    <button type="button" class="reaction-choice rounded-full p-2 text-2xl transition hover:bg-zinc-100 active:scale-90" data-reaction="😍" aria-label="React with love">😍</button>
                    <button type="button" class="reaction-choice rounded-full p-2 text-2xl transition hover:bg-zinc-100 active:scale-90" data-reaction="😮" aria-label="React with surprise">😮</button>
                    <button type="button" class="reaction-choice rounded-full p-2 text-2xl transition hover:bg-zinc-100 active:scale-90" data-reaction="😢" aria-label="React with sadness">😢</button>
                    <button type="button" class="reaction-choice rounded-full p-2 text-2xl transition hover:bg-zinc-100 active:scale-90" data-reaction="👍" aria-label="React with thumbs up">👍</button>
                </div>
                ${ownerActions}`;
        }

        messagesList.addEventListener('pointerdown', event => {
            const bubble = event.target.closest('.message-bubble-button');
            if (!bubble || event.button !== 0) return;
            stopLongPress();
            pressStart = { x: event.clientX, y: event.clientY, id: bubble.dataset.messageId };
            pressTimer = setTimeout(() => {
                suppressNextMessageClick = true;
                openMessageActions(pressStart?.id);
                setTimeout(() => { suppressNextMessageClick = false; }, 1000);
                stopLongPress();
            }, 700);
        });

        messagesList.addEventListener('pointermove', event => {
            if (!pressStart) return;
            if (Math.hypot(event.clientX - pressStart.x, event.clientY - pressStart.y) > 12) {
                stopLongPress();
            }
        });

        messagesList.addEventListener('pointerup', stopLongPress);
        messagesList.addEventListener('pointercancel', stopLongPress);
        messagesList.addEventListener('pointerleave', stopLongPress);
        messagesList.addEventListener('contextmenu', event => {
            const bubble = event.target.closest('.message-bubble-button');
            if (!bubble) return;
            event.preventDefault();
            suppressNextMessageClick = true;
            setTimeout(() => { suppressNextMessageClick = false; }, 1000);
            openMessageActions(bubble.dataset.messageId);
        });
        messagesList.addEventListener('click', event => {
            const bubble = event.target.closest('.message-bubble-button');
            if (!bubble || !suppressNextMessageClick) return;
            event.preventDefault();
            suppressNextMessageClick = false;
        });

        messageActionsModal.addEventListener('click', event => {
            if (event.target === messageActionsModal) messageActionsModal.close();
        });

        messageActionsContent.addEventListener('click', async event => {
            const choice = event.target.closest('.reaction-choice');
            if (choice && selectedMessage && currentUser) {
                const messageRef = doc(db, 'chats', chatId, 'messages', selectedMessage.id);
                try {
                    await runTransaction(db, async transaction => {
                        const snapshot = await transaction.get(messageRef);
                        if (!snapshot.exists()) throw new Error('This message is no longer available.');
                        const data = snapshot.data();
                        const reactions = data.reactions && typeof data.reactions === 'object' ? { ...data.reactions } : {};
                        if (reactions[currentUser.uid] === choice.dataset.reaction) {
                            delete reactions[currentUser.uid];
                        } else {
                            reactions[currentUser.uid] = choice.dataset.reaction;
                        }
                        transaction.update(messageRef, { reactions });
                    });
                    messageActionsModal.close();
                } catch (error) {
                    console.error('Could not react to message:', error);
                    alert(error.message || 'Could not add your reaction. Please try again.');
                }
                return;
            }

            const action = event.target.closest('[data-message-action]')?.dataset.messageAction;
            if (action === 'edit' && selectedMessage?.senderId === currentUser.uid) {
                messageActionsContent.innerHTML = `
                    <form id="edit-message-form" class="space-y-3">
                    <label for="edit-message-input" class="block text-sm font-semibold text-zinc-900">Edit message</label>
                    <textarea id="edit-message-input" maxlength="2000" rows="3" class="w-full resize-none rounded-xl border border-zinc-200 bg-zinc-50 p-3 text-sm text-zinc-900 outline-none focus:border-rose-400 focus:bg-white"></textarea>
                    <div class="flex justify-end gap-2">
                        <button type="button" id="cancel-edit-message" class="rounded-full px-4 py-2 text-sm font-semibold text-zinc-600 hover:bg-zinc-100">Cancel</button>
                        <button type="submit" class="rounded-full bg-rose-500 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-600">Save</button>
                    </div>
                </form>`;
                const input = document.getElementById('edit-message-input');
                input.value = selectedMessage.text || '';
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
            } else if (event.target.closest('#cancel-edit-message') || event.target.closest('#cancel-delete-message')) {
                renderMessageActions();
                lucide.createIcons();
            } else if (action === 'delete' && selectedMessage?.senderId === currentUser.uid) {
                messageActionsContent.innerHTML = `
                    <div class="space-y-3 text-center">
                        <h2 class="text-base font-bold text-zinc-900">Delete this message?</h2>
                        <p class="text-sm text-zinc-500">This message will be removed from the conversation.</p>
                        <div class="flex justify-center gap-2 pt-1">
                            <button id="cancel-delete-message" type="button" class="rounded-full px-4 py-2 text-sm font-semibold text-zinc-600 hover:bg-zinc-100">Cancel</button>
                            <button type="button" data-confirm-delete class="rounded-full bg-rose-500 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-600">Delete</button>
                        </div>
                    </div>`;
            } else if (event.target.closest('[data-confirm-delete]')) {
                await deleteSelectedMessage();
            }
        });

        messageActionsContent.addEventListener('submit', async event => {
            if (event.target.id !== 'edit-message-form') return;
            event.preventDefault();
            const text = document.getElementById('edit-message-input').value.trim();
            if (!text || !selectedMessage || selectedMessage.senderId !== currentUser.uid) return;
            const messageRef = doc(db, 'chats', chatId, 'messages', selectedMessage.id);
            const chatRef = doc(db, 'chats', chatId);
            try {
                await runTransaction(db, async transaction => {
                    const [messageSnapshot, chatSnapshot] = await Promise.all([
                        transaction.get(messageRef),
                        transaction.get(chatRef)
                    ]);
                    if (!messageSnapshot.exists()) throw new Error('This message is no longer available.');
                    transaction.update(messageRef, { text, edited: true, editedAt: serverTimestamp() });
                    const chatData = chatSnapshot.exists() ? chatSnapshot.data() : {};
                    const isLastMessage = chatData.lastMessageId
                        ? chatData.lastMessageId === selectedMessage.id
                        : currentMessages.at(-1)?.id === selectedMessage.id &&
                          chatData.lastMessage === messageSnapshot.data().text && chatData.lastSenderId === currentUser.uid;
                    if (chatSnapshot.exists() && isLastMessage) {
                        transaction.update(chatRef, { lastMessage: text, updatedAt: serverTimestamp() });
                    }
                });
                messageActionsModal.close();
            } catch (error) {
                console.error('Could not edit message:', error);
                alert(error.message || 'Could not edit this message. Please try again.');
            }
        });

        async function deleteSelectedMessage() {
            if (!selectedMessage || selectedMessage.senderId !== currentUser.uid) return;
            const message = selectedMessage;
            const messageRef = doc(db, 'chats', chatId, 'messages', message.id);
            const chatRef = doc(db, 'chats', chatId);
            try {
                await runTransaction(db, async transaction => {
                    const [messageSnapshot, chatSnapshot] = await Promise.all([
                        transaction.get(messageRef),
                        transaction.get(chatRef)
                    ]);
                    if (!messageSnapshot.exists()) return;
                    transaction.delete(messageRef);
                    const chatData = chatSnapshot.exists() ? chatSnapshot.data() : {};
                    const isLastMessage = chatData.lastMessageId
                        ? chatData.lastMessageId === message.id
                        : currentMessages.at(-1)?.id === message.id &&
                          chatData.lastMessage === messageSnapshot.data().text && chatData.lastSenderId === currentUser.uid;
                    if (chatSnapshot.exists() && isLastMessage) {
                        const previousMessage = [...currentMessages].reverse().find(item => item.id !== message.id);
                        transaction.update(chatRef, {
                            lastMessage: messagePreview(previousMessage),
                            lastSenderId: previousMessage?.senderId || '',
                            lastMessageId: previousMessage?.id || null,
                            updatedAt: serverTimestamp()
                        });
                    }
                });
                messageActionsModal.close();
            } catch (error) {
                console.error('Could not delete message:', error);
                alert(error.message || 'Could not delete this message. Please try again.');
            }
        }

        messageActionsModal.addEventListener('close', () => {
            selectedMessage = null;
        });

        // Auth state handler
        onAuthStateChanged(auth, async user => {
            if (!user) {
                const returnTo = `${location.pathname}${location.search}`;
                location.replace(`./oauth.html?returnTo=${encodeURIComponent(returnTo)}`);
                return;
            }
            currentUser = user;
            unsubscribeUnreadMessages?.();
            unsubscribeUnreadMessages = subscribeToUnreadMessages(db, user.uid);

            const loaded = await loadProfiles();
            if (loaded) {
                subscribeToMessages();
            }
        });
    </script>
</body>
</html>
