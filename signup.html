<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign up - TikTok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
    <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black text-white font-sans antialiased">
<div id="app" class="relative w-full h-full max-w-md mx-auto bg-tiktok-dark overflow-hidden flex flex-col border-x border-gray-900">
    <header class="shrink-0 flex items-center justify-between px-4 pb-3 safe-top">
        <a href="index.html" aria-label="Back to feed" class="p-1 -ml-1"><i data-lucide="x" class="w-6 h-6"></i></a>
        <a href="login.html" id="to-login" class="text-sm font-semibold text-tiktok-red">Log in</a>
    </header>

    <main class="flex-1 min-h-0 overflow-y-auto no-scrollbar px-6 pb-10">
        <h1 class="text-2xl font-extrabold text-center mt-4">Sign up for TikTok</h1>
        <p class="text-center text-sm text-gray-400 mt-2">Create an account to like, comment, follow and post.</p>

        <form id="signup-form" class="mt-8 space-y-3" novalidate>
            <label class="block">
                <span class="text-xs text-gray-400">Username</span>
                <input id="username" type="text" autocomplete="username" maxlength="24" required class="mt-1 w-full bg-gray-800 rounded-md px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-tiktok-red">
                <span class="text-[11px] text-gray-500">3–24 characters: letters, numbers, _ and .</span>
            </label>
            <label class="block">
                <span class="text-xs text-gray-400">Email</span>
                <input id="email" type="email" autocomplete="email" required class="mt-1 w-full bg-gray-800 rounded-md px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-tiktok-red">
            </label>
            <label class="block">
                <span class="text-xs text-gray-400">Password</span>
                <input id="password" type="password" autocomplete="new-password" minlength="6" required class="mt-1 w-full bg-gray-800 rounded-md px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-tiktok-red">
            </label>
            <label class="flex items-start space-x-2 text-xs text-gray-400 pt-1">
                <input id="terms" type="checkbox" class="mt-0.5 accent-[#FE2C55]">
                <span>I agree to the Terms of Service and Privacy Policy.</span>
            </label>
            <p id="error" class="hidden text-sm text-tiktok-red" role="alert"></p>
            <button id="submit" type="submit" class="w-full bg-tiktok-red hover:bg-red-600 disabled:opacity-50 font-bold py-3 rounded-md transition">Create account</button>
        </form>

        <div class="flex items-center my-6 text-xs text-gray-500"><div class="flex-1 h-px bg-gray-800"></div><span class="px-3">or</span><div class="flex-1 h-px bg-gray-800"></div></div>

        <button id="google" class="w-full flex items-center justify-center space-x-2 border border-gray-700 hover:bg-gray-800 py-3 rounded-md font-semibold text-sm transition">
            <i data-lucide="log-in" class="w-5 h-5"></i><span>Continue with Google</span>
        </button>

        <p class="text-center text-sm text-gray-400 mt-8">Already have an account? <a id="to-login-2" href="login.html" class="text-tiktok-red font-semibold">Log in</a></p>
        <p class="text-center text-sm mt-4"><a href="index.html" class="text-gray-400 hover:text-white underline">Continue as guest</a></p>
    </main>
</div>

<script type="module">
import { authReady, signUp, logInWithGoogle, friendlyError, getRedirect } from './firebase.js';
import { icons } from './ui.js';

icons();
const $ = (id) => document.getElementById(id);
const redirect = getRedirect();

const r = new URLSearchParams(location.search).get('redirect');
if (r) ['to-login', 'to-login-2'].forEach((id) => ($(id).href = 'login.html?redirect=' + encodeURIComponent(r)));

if (await authReady) location.replace(redirect);

const showError = (m) => { $('error').textContent = m; $('error').classList.toggle('hidden', !m); };
const busy = (on) => { $('submit').disabled = on; $('google').disabled = on; $('submit').textContent = on ? 'Creating account…' : 'Create account'; };

$('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    showError('');
    const username = $('username').value, email = $('email').value.trim(), password = $('password').value;
    if (!username || !email || !password) return showError('Fill in all fields.');
    if (password.length < 6) return showError('Password must be at least 6 characters.');
    if (!$('terms').checked) return showError('Please accept the Terms to continue.');
    busy(true);
    try { await signUp({ email, password, username }); location.href = redirect; }
    catch (err) { showError(friendlyError(err)); busy(false); }
});

$('google').addEventListener('click', async () => {
    showError(''); busy(true);
    try { await logInWithGoogle(); location.href = redirect; }
    catch (err) { showError(friendlyError(err)); busy(false); }
});
</script>
</body>
</html>
