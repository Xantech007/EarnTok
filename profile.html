<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>EarnTok · Your profile</title>
    <link rel="icon" type="image/png" href="./earntok-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { color-scheme: light; }
        body { min-height: 100vh; }
        .field { width: 100%; border: 1px solid #3f3f46; border-radius: .75rem; background: #09090b; padding: .75rem .875rem; color: #fafafa; outline: none; }
        .field:focus { border-color: #25f4ee; }
        .tab-active { color: white; border-color: #fe2c55; }
        dialog { color: #fafafa; }
        dialog::backdrop { background: rgba(0,0,0,.75); backdrop-filter: blur(5px); }
        body.bg-zinc-950 { background: #fff !important; color: #161823 !important; }
        .bg-zinc-950, .bg-zinc-950\/90, .bg-zinc-950\/95 { background-color: #fff !important; }
        .bg-zinc-900, .bg-zinc-900\/90, .bg-zinc-900\/70, .bg-zinc-900\/50 { background-color: #f8f8fa !important; }
        .bg-zinc-800 { background-color: #f1f1f2 !important; }
        .text-zinc-100 { color: #161823 !important; }
        .profile-video-viewer .text-white { color: #fff !important; }
        .text-zinc-300 { color: #454550 !important; }
        .text-zinc-400, .text-zinc-500, .text-zinc-600 { color: #777782 !important; }
        .border-zinc-800, .border-zinc-700 { border-color: #e4e4e8 !important; }
        .field { background: #fff; border-color: #d8d8de; color: #161823; }
        .tab-active { color: #161823; }
        .text-sky-400 { color: #0284c7 !important; }
        p.text-cyan-300 { color: #0e7490 !important; }
        p.text-rose-300 { color: #be123c !important; }
        img.rounded-full, #profile-pic, .avatar-img {
            object-fit: cover !important;
            aspect-ratio: 1 / 1 !important;
        }
        #profile-pic-button {
            width: 7rem !important;
            height: 7rem !important;
            min-width: 7rem !important;
            min-height: 7rem !important;
            max-width: 7rem !important;
            max-height: 7rem !important;
            flex-shrink: 0 !important;
            border-radius: 9999px !important;
        }
        #profile-pic {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased">
    <header class="sticky top-0 z-20 border-b border-zinc-800 bg-zinc-950/90 backdrop-blur">
        <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
            <a href="./index.html" class="text-zinc-100 hover:opacity-80" aria-label="Back to feed">
                <i data-lucide="arrow-left" class="h-6 w-6 stroke-[2.5]" aria-hidden="true"></i>
            </a>
            <div class="flex items-center gap-3">
                <button id="edit-profile-button" class="text-zinc-900 hover:opacity-80" type="button" aria-label="Edit profile">
                <i data-lucide="pencil" class="h-6 w-6 stroke-[2.5]" aria-hidden="true"></i>
                </button>
                <button id="viewers-icon-button" class="relative text-zinc-100 hover:opacity-80 p-1" aria-label="Profile viewers" title="Profile viewers">
                    <i data-lucide="eye" class="h-6 w-6 stroke-[2.2]" aria-hidden="true"></i>
                    <span id="viewer-badge" class="absolute -top-1 -right-1 hidden bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">0</span>
                </button>

            </div>
        </div>
    </header>
    <!-- BOTTOM MOBILE NAVIGATION BAR -->
    <nav class="fixed inset-x-0 bottom-0 z-30 flex items-center justify-around border-t border-zinc-200 bg-white px-3 pt-2 pb-[max(.5rem,env(safe-area-inset-bottom))] text-xs font-medium shadow-[0_-4px_16px_rgba(0,0,0,.06)]">
        <a href="./index.html" class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-black" aria-label="Home">
            <i data-lucide="home" class="h-6 w-6" aria-hidden="true"></i><span>Home</span>
        </a>
        <a href="friends.html" id="nav-friends" class="flex flex-col items-center text-gray-400 hover:text-black space-y-0.5">
            <i data-lucide="users" class="w-6 h-6" aria-hidden="true"></i>
            <span>Friends</span>
        </a>
        <!-- Create Button (+) with TikTok Dual-Glow Effect -->
        <a href="./index.html?openCreate=1" class="group relative flex h-8 w-[54px] items-center justify-center active:scale-95 transition" aria-label="Create a video or photo">
            <span class="absolute left-0 z-0 h-7 w-[45px] rounded-lg bg-cyan-400" style="background-color:#25f4ee"></span>
            <span class="absolute right-0 z-0 h-7 w-[45px] rounded-lg bg-rose-500" style="background-color:#fe2c55"></span>
            <span class="relative z-10 flex h-7 w-11 items-center justify-center rounded-lg bg-black text-white">
                <i data-lucide="plus" class="w-5 h-5 stroke-[3]" aria-hidden="true"></i>
            </span>
        </a>
        <a href="inbox.html" id="nav-inbox" class="flex flex-col items-center text-gray-400 hover:text-black space-y-0.5 relative">
            <i data-lucide="message-square" class="w-6 h-6" aria-hidden="true"></i>
            <span data-unread-message-badge class="absolute top-0 right-2 hidden min-w-4 h-4 items-center justify-center rounded-full bg-rose-500 px-1 text-[10px] font-bold leading-none text-white" aria-hidden="true"></span>
            <span>Inbox</span>
        </a>
        <a href="./profile.html" id="nav-profile" class="flex flex-col items-center text-rose-500 hover:text-black space-y-0.5">
            <i data-lucide="user" class="w-6 h-6" aria-hidden="true"></i>
            <span>Profile</span>
        </a>
    </nav>
    <main class="mx-auto max-w-5xl px-4 pb-24 sm:pb-16">
        <section class="border-b border-zinc-800 py-8 sm:py-10">
            <div class="flex flex-col gap-6 sm:flex-row sm:items-center">
                <button id="profile-pic-button" class="relative h-28 w-28 shrink-0 self-center overflow-hidden rounded-full bg-zinc-800 sm:self-auto" type="button" aria-label="Change profile picture">
                    <img id="profile-pic" class="h-full w-full object-cover" alt="Your profile picture">
                    <span class="absolute inset-x-0 bottom-0 bg-black/60 py-1 text-center text-xs text-white">Edit photo</span>
                </button>
                <div class="min-w-0 flex-1 text-center sm:text-left">
                    <p class="text-sm text-zinc-500">Your profile</p>
                    <h1 id="profile-name" class="mt-1 truncate text-3xl font-bold">Loading profile…</h1>
                    <p class="mt-1 text-zinc-400"><span class="inline-flex items-center gap-1"><span id="profile-username"></span><i id="profile-verified" data-lucide="badge-check" class="inline-block h-4 w-4 align-middle text-sky-400" title="Verified creator" aria-label="Verified creator"></i></span></p>
                    <div class="mt-4 flex flex-wrap justify-center gap-x-7 gap-y-2 text-sm sm:justify-start">
                        <button id="follower-btn" class="hover:underline cursor-pointer"><strong id="follower-count" class="text-zinc-950">0</strong> followers</button>
                        <button id="following-btn" class="hover:underline cursor-pointer"><strong id="following-count" class="text-zinc-950">0</strong> following</button>
                        <span><strong id="like-count" class="text-zinc-950">0</strong> likes</span>
                    </div>
                    <p id="profile-bio" class="mx-auto mt-4 max-w-xl whitespace-pre-wrap text-sm text-zinc-300 sm:mx-0"></p>
                </div>
            </div>
        </section>

        <section class="mt-4">
            <div class="flex overflow-x-auto border-b border-zinc-800" role="tablist" aria-label="Your content">
                <button class="content-tab tab-active shrink-0 border-b-2 px-4 py-3 text-sm font-semibold" data-tab="uploads" type="button">Uploads</button>
                <button class="content-tab shrink-0 border-b-2 border-transparent px-4 py-3 text-sm font-semibold text-zinc-500" data-tab="liked" type="button">Liked</button>
                <button class="content-tab shrink-0 border-b-2 border-transparent px-4 py-3 text-sm font-semibold text-zinc-500" data-tab="saved" type="button">Saved</button>
            </div>
            <div id="upload-filters" class="flex gap-2 py-4">
                <button class="upload-filter rounded-full bg-zinc-800 px-4 py-2 text-xs font-semibold" data-filter="all" type="button">All</button>
                <button class="upload-filter rounded-full px-4 py-2 text-xs font-semibold text-zinc-500" data-filter="published" type="button">Published</button>
                <button class="upload-filter rounded-full px-4 py-2 text-xs font-semibold text-zinc-500" data-filter="draft" type="button">Drafts</button>
            </div>
            <div id="content-grid" class="grid grid-cols-3 gap-[1px] bg-white py-4">
                <div class="col-span-full py-16 text-center text-zinc-400 bg-white">
                    <i data-lucide="loader" class="h-8 w-8 animate-spin mx-auto text-rose-500 mb-2"></i>
                    <p class="text-sm">Loading your profile…</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Users Modal -->
    <div id="users-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
        <div class="relative w-full max-w-md rounded-2xl bg-white p-6 shadow-xl max-h-[80vh] flex flex-col">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 id="users-modal-title" class="text-lg font-bold">Users</h3>
                <button id="users-modal-close" class="rounded-lg p-1 text-zinc-500 hover:bg-zinc-100"><i data-lucide="x" class="h-5 w-5"></i></button>
            </div>
            <div id="users-modal-list" class="mt-4 divide-y divide-zinc-100 overflow-y-auto flex-1">
                <div class="py-12 text-center text-zinc-400">
                    <i data-lucide="loader" class="h-8 w-8 animate-spin mx-auto text-rose-500 mb-2"></i>
                    <p class="text-sm">Loading…</p>
                </div>
            </div>
        </div>
    </div>

    <dialog id="edit-dialog" class="w-[min(30rem,calc(100%-2rem))] rounded-2xl border border-zinc-700 bg-zinc-900 p-0 shadow-2xl">
        <form id="edit-form" class="space-y-4 p-6">
            <div><p class="text-xs font-bold uppercase tracking-[.2em] text-cyan-300">Profile settings</p><h2 class="mt-1 text-2xl font-bold">Edit profile</h2></div>
            <label class="block text-sm font-medium text-zinc-300">Display name<input id="edit-name" class="field mt-2" maxlength="120"></label>
            <label class="block text-sm font-medium text-zinc-300">Bio<textarea id="edit-bio" class="field mt-2 min-h-28 resize-y" maxlength="500" placeholder="Tell people a little about yourself"></textarea></label>
            <label class="block text-sm font-medium text-zinc-300">Profile picture<input id="profile-file" class="field mt-2" type="file" accept="image/*"></label>
            <p id="edit-message" class="hidden rounded-xl border p-3 text-sm" role="status"></p>
            <div class="flex justify-end gap-2">
                <button id="cancel-edit" class="rounded-xl bg-zinc-800 px-4 py-2.5 font-semibold" type="button">Cancel</button>
                <button id="save-profile" class="rounded-xl bg-rose-500 px-4 py-2.5 font-semibold text-white disabled:opacity-60" type="submit">Save changes</button>
            </div>
        </form>
    </dialog>

    <script type="module">
        import { auth, db } from './firebase.js';
        import { getUserFollowStats } from './follows.js';
        import { createProfileVideoViewer } from './profile-video-viewer.js';
        import { subscribeToUnreadMessages } from './unread-messages.js';
        import { onAuthStateChanged, updateProfile } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import {
            collection, deleteDoc, doc, getDoc, getDocs, query, serverTimestamp,
            setDoc, updateDoc, where
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        lucide.createIcons();
        const CLOUD_NAME = 's35mxosr';
        const UPLOAD_PRESET = 'user_uploads';
        const contentGrid = document.getElementById('content-grid');
        const editDialog = document.getElementById('edit-dialog');
        const videoViewer = createProfileVideoViewer({ auth, db });
        let user = null;
        let profile = {};
        let uploads = [];
        let likedVideos = [];
        let savedVideos = [];
        let pinnedVideos = [];
        let activeTab = 'uploads';
        let activeFilter = 'all';
        let viewerActivities = [];
        let viewerLoadFailed = false;
        let unsubscribeUnreadMessages = null;
        let renderedItems = [];

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&#38;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function typeOf(video) {
            if (video.mediaType === 'image') return 'image';
            if (video.mediaType === 'video') return 'video';
            return /\.(avif|gif|jpe?g|png|webp|bmp|heic)(?:\?|\$)/i.test(video.link || '') ? 'image' : 'video';
        }

        function showError(error) {
            console.error(error);
            contentGrid.innerHTML = '<p class="col-span-full py-12 text-center text-sm text-rose-300 bg-white">Could not load this profile data. Check Firestore permissions and try again.</p>';
        }

        function formatCount(value) {
            return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(value);
        }

        function loadProfileHeader() {
            document.getElementById('profile-name').textContent = profile.fullName || user.displayName || 'EarnTok user';
            document.getElementById('profile-username').textContent = profile.username ? `@${profile.username}` : user.email || '';
            document.getElementById('profile-verified').classList.toggle('hidden', profile.verify !== 'yes');
            document.getElementById('profile-bio').textContent = profile.bio || '';
            const pic = document.getElementById('profile-pic');
            pic.src = profile.profilePic || user.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80';
            pic.onerror = () => { pic.src = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80'; };
            document.getElementById('edit-name').value = profile.fullName || user.displayName || '';
            document.getElementById('edit-bio').value = profile.bio || '';
        }

        function updateLikeCount() {
            const totalLikes = uploads.reduce((total, video) => {
                const likes = Number(video.likesCount);
                return total + (video.admin === 'yes' && Number.isFinite(likes) && likes > 0 ? Math.floor(likes) : 0);
            }, 0);
            document.getElementById('like-count').textContent = formatCount(totalLikes);
        }

        function mediaMarkup(video, pinned = false, canManage = false) {
            const src = escapeHtml(video.link);
            const media = typeOf(video) === 'image'
                ? `<img class="aspect-[3/4] w-full object-cover" src="${src}" alt="${escapeHtml(video.description || '')}" loading="lazy">`
                : `<video class="aspect-[3/4] w-full object-cover" src="${src}" muted playsinline preload="metadata"></video>`;
            const isPublished = video.admin === 'yes';
            const pinIconHtml = canManage && isPublished
                ? `<button class="pin-video absolute top-2 right-2 z-20 flex h-7 w-7 items-center justify-center rounded-full ${pinned ? 'bg-rose-500 text-white shadow-md' : 'bg-black/50 text-white/80 hover:bg-rose-500 hover:text-white backdrop-blur-sm'} transition" data-id="${escapeHtml(video.id)}" type="button" title="${pinned ? 'Unpin post' : 'Pin post'}" aria-label="${pinned ? 'Unpin post' : 'Pin post'}"><i data-lucide="pin" class="h-3.5 w-3.5 ${pinned ? 'fill-current' : ''}"></i></button>`
                : (pinned ? `<span class="absolute top-2 right-2 z-10 flex h-7 w-7 items-center justify-center rounded-full bg-rose-500 text-white shadow-md" title="Pinned post" aria-label="Pinned post"><i data-lucide="pin" class="h-3.5 w-3.5 fill-current"></i></span>` : '');

            return `<article class="group relative overflow-hidden bg-zinc-900 ${isPublished ? 'cursor-pointer' : ''}" data-profile-video-id="${escapeHtml(video.id)}" ${isPublished ? 'tabindex="0" role="button"' : ''} aria-label="Watch ${escapeHtml(video.description || 'post')}">
                ${media}
                ${pinIconHtml}
            </article>`;
        }

        async function loadUsersModal(type, userId) {
            const modal = document.getElementById('users-modal');
            const title = document.getElementById('users-modal-title');
            const list = document.getElementById('users-modal-list');
            
            if (type === 'viewers') {
                title.textContent = 'Profile Viewers';
                if (viewerLoadFailed) {
                    list.innerHTML = '<p class="py-8 text-center text-sm text-rose-500">Could not load profile viewers.</p>';
                } else if (viewerActivities.length === 0) {
                    list.innerHTML = '<p class="py-8 text-center text-sm text-zinc-500">No profile views yet.</p>';
                } else {
                    list.innerHTML = viewerActivities.map(activity => {
                        if (activity.userId.startsWith('guest-')) {
                            return `<div class="flex items-center gap-3 py-3 px-2 rounded-lg">
                                <span class="flex h-10 w-10 items-center justify-center rounded-full bg-zinc-200 text-sm font-bold">?</span>
                                <div class="min-w-0 flex-1">
                                    <p class="truncate font-semibold text-sm">Anonymous viewer</p>
                                    <p class="truncate text-xs text-zinc-500">${escapeHtml(activity.createdAt?.toDate?.().toLocaleString?.() || 'Viewed your profile')}</p>
                                </div>
                            </div>`;
                        }
                        const handle = activity.visitorUsername ? `@${activity.visitorUsername}` : `@user_${activity.userId.slice(0, 5)}`;
                        return `<a href="./view-profile.html?uid=${encodeURIComponent(activity.userId)}" class="flex items-center gap-3 py-3 hover:bg-zinc-50 px-2 rounded-lg transition">
                            <img src="${escapeHtml(activity.visitorPic || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80')}" class="h-10 w-10 min-w-[2.5rem] min-h-[2.5rem] max-w-[2.5rem] max-h-[2.5rem] shrink-0 rounded-full bg-zinc-200 object-cover" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80'" alt="">
                            <div class="min-w-0 flex-1">
                                <p class="truncate font-semibold text-sm text-zinc-900">${escapeHtml(activity.visitorFullName || 'EarnTok user')}</p>
                                <p class="truncate text-xs text-zinc-500">${escapeHtml(handle)}</p>
                            </div>
                        </a>`;
                    }).join('');
                }
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                lucide.createIcons();
                return;
            }

            title.textContent = type === 'followers' ? 'Followers' : 'Following';
            list.innerHTML = '<div class="py-12 text-center text-zinc-400"><i data-lucide="loader" class="h-8 w-8 animate-spin mx-auto text-rose-500 mb-2"></i><p class="text-sm">Loading…</p></div>';
            lucide.createIcons();
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                const followsSnap = await getDocs(query(
                    collection(db, 'follows'),
                    where(type === 'followers' ? 'followingId' : 'followerId', '==', userId)
                ));

                const targetField = type === 'followers' ? 'followerId' : 'followingId';
                const userIds = followsSnap.docs.map(docSnap => docSnap.data()[targetField]);

                if (userIds.length === 0) {
                    list.innerHTML = `<p class="py-8 text-center text-sm text-zinc-500">No ${type} yet.</p>`;
                    return;
                }

                const profiles = [];
                for (let i = 0; i < userIds.length; i += 10) {
                    const chunk = userIds.slice(i, i + 10);
                    const profilesSnap = await getDocs(query(collection(db, 'profiles'), where('__name__', 'in', chunk)));
                    const found = new Set();
                    profilesSnap.forEach(docSnap => {
                        found.add(docSnap.id);
                        profiles.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    for (const id of chunk) {
                        if (!found.has(id)) {
                            try {
                                const uSnap = await getDoc(doc(db, 'users', id));
                                if (uSnap.exists()) {
                                    const uData = uSnap.data();
                                    profiles.push({
                                        id,
                                        fullName: uData.fullName || uData.displayName || 'EarnTok user',
                                        username: uData.username || (uData.email ? uData.email.split('@')[0] : ''),
                                        profilePic: uData.profilePic || uData.photoURL || ''
                                    });
                                } else {
                                    profiles.push({
                                        id,
                                        fullName: 'EarnTok user',
                                        username: '',
                                        profilePic: ''
                                    });
                                }
                            } catch (e) {
                                console.error('Fallback fetch error:', e);
                            }
                        }
                    }
                }

                if (profiles.length === 0) {
                    list.innerHTML = `<p class="py-8 text-center text-sm text-zinc-500">No ${type} yet.</p>`;
                    return;
                }

                list.innerHTML = profiles.map(p => {
                    const handle = p.username ? `@${p.username}` : (p.email ? `@${p.email.split('@')[0]}` : `@user_${p.id.slice(0, 5)}`);
                    const name = p.fullName || 'EarnTok user';
                    const pic = p.profilePic || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80';
                    return `
                        <a href="./view-profile.html?uid=${encodeURIComponent(p.id)}" class="flex items-center gap-3 py-3 hover:bg-zinc-50 px-2 rounded-lg transition">
                            <img src="${escapeHtml(pic)}" class="h-10 w-10 min-w-[2.5rem] min-h-[2.5rem] max-w-[2.5rem] max-h-[2.5rem] shrink-0 rounded-full bg-zinc-200 object-cover" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80'" alt="">
                            <div class="min-w-0 flex-1">
                                <p class="truncate font-semibold text-sm text-zinc-900">${escapeHtml(name)}</p>
                                <p class="truncate text-xs text-zinc-500">${escapeHtml(handle)}</p>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (err) {
                console.error(`Error loading ${type}:`, err);
                list.innerHTML = `<p class="py-8 text-center text-sm text-rose-500">Failed to load ${type}.</p>`;
            }
        }

        function renderContent() {
            document.querySelectorAll('.content-tab').forEach(button => {
                const selected = button.dataset.tab === activeTab;
                button.classList.toggle('tab-active', selected);
                button.classList.toggle('border-transparent', !selected);
                button.classList.toggle('text-zinc-500', !selected);
            });
            document.getElementById('upload-filters').classList.toggle('hidden', activeTab !== 'uploads');
            
            let items = activeTab === 'liked' ? likedVideos : activeTab === 'saved' ? savedVideos : uploads;
            if (activeTab === 'uploads' && activeFilter !== 'all') {
                items = items.filter(video => activeFilter === 'published' ? video.admin === 'yes' : video.admin !== 'yes');
            }

            if (activeTab === 'uploads') {
                const pinnedItems = pinnedVideos.map(id => uploads.find(video => video.id === id)).filter(video => video?.admin === 'yes');
                const pinnedSet = new Set(pinnedItems.map(p => p.id));
                const unpinnedItems = items.filter(video => !pinnedSet.has(video.id));
                items = [...pinnedItems, ...unpinnedItems];
            }

            renderedItems = [...items];
            contentGrid.innerHTML = items.length ? items.map(video => mediaMarkup(video, pinnedVideos.includes(video.id), activeTab === 'uploads')).join('')
                : `<p class="col-span-full py-12 text-center text-sm text-zinc-500 bg-white">${activeTab === 'uploads' ? activeFilter === 'draft' ? 'No drafts yet.' : 'No uploads yet.' : activeTab === 'liked' ? 'Videos you like will appear here.' : 'Videos you save will appear here.'}</p>`;
            lucide.createIcons();
        }

        async function loadVideosByIds(ids) {
            const uniqueIds = [...new Set(ids)].slice(0, 100);
            const result = await Promise.all(uniqueIds.map(async id => {
                const snapshot = await getDoc(doc(db, 'videos', id));
                return snapshot.exists() && snapshot.data().admin === 'yes' ? { id: snapshot.id, ...snapshot.data() } : null;
            }));
            return result.filter(Boolean);
        }

        async function loadViewerActivities() {
            try {
                const snapshot = await getDocs(query(collection(db, 'activity'), where('profileId', '==', user.uid)));
                const latest = new Map();
                const activities = snapshot.docs.map(entry => ({ id: entry.id, ...entry.data() }))
                    .sort((left, right) => (right.createdAt?.toMillis?.() || 0) - (left.createdAt?.toMillis?.() || 0));
                for (const item of activities) {
                    if (item.action !== 'profile_view' || !item.userId || item.userId === user.uid || latest.has(item.userId)) continue;
                    let visitor = {};
                    if (!item.userId.startsWith('guest-')) {
                        try {
                            const visitorSnapshot = await getDoc(doc(db, 'profiles', item.userId));
                            if (visitorSnapshot.exists()) {
                                visitor = visitorSnapshot.data();
                            } else {
                                const uSnapshot = await getDoc(doc(db, 'users', item.userId));
                                if (uSnapshot.exists()) {
                                    visitor = uSnapshot.data();
                                }
                            }
                        } catch (e) {
                            console.error('Error fetching visitor profile:', e);
                        }
                    }
                    latest.set(item.userId, {
                        ...item,
                        visitorFullName: visitor.fullName || visitor.displayName || 'EarnTok user',
                        visitorUsername: visitor.username || (visitor.email ? visitor.email.split('@')[0] : ''),
                        visitorPic: visitor.profilePic || visitor.photoURL || ''
                    });
                }
                viewerActivities = [...latest.values()];
                const badge = document.getElementById('viewer-badge');
                if (viewerActivities.length > 0) {
                    badge.textContent = viewerActivities.length;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            } catch (error) {
                console.error('Unable to load profile viewers:', error);
                viewerLoadFailed = true;
            }
        }

        async function loadProfile() {
            const [userSnapshot, publicProfileSnapshot, ownVideosSnapshot, followStats] = await Promise.all([
                getDoc(doc(db, 'users', user.uid)),
                getDoc(doc(db, 'profiles', user.uid)),
                getDocs(query(collection(db, 'videos'), where('userId', '==', user.uid))),
                getUserFollowStats(user.uid)
            ]);
            profile = publicProfileSnapshot.exists() ? publicProfileSnapshot.data() : {};
            if (!publicProfileSnapshot.exists()) {
                profile = {
                    uid: user.uid,
                    fullName: userSnapshot.data()?.fullName || user.displayName || '',
                    username: userSnapshot.data()?.username || user.email?.split('@')[0] || '',
                    usernameLower: (userSnapshot.data()?.username || user.email?.split('@')[0] || '').toLowerCase(),
                    profilePic: '',
                    bio: '',
                    pinnedVideos: []
                };
                await setDoc(doc(db, 'profiles', user.uid), profile);
            }
            if (!userSnapshot.exists()) {
                await setDoc(doc(db, 'users', user.uid), {
                    uid: user.uid,
                    fullName: profile.fullName || user.displayName || '',
                    username: profile.username || '',
                    usernameLower: profile.usernameLower || (profile.username || '').toLowerCase(),
                    email: user.email || '',
                    profilePic: profile.profilePic || '',
                    bio: profile.bio || '',
                    likedVideoIds: [],
                    savedVideoIds: [],
                    pinnedVideos: profile.pinnedVideos || []
                }, { merge: true });
            }
            uploads = ownVideosSnapshot.docs.map(item => ({ id: item.id, ...item.data() }));
            const accountData = userSnapshot.exists() ? userSnapshot.data() : {};
            profile.verify = profile.verify === 'yes' || accountData.verify === 'yes' ? 'yes' : 'no';
            pinnedVideos = Array.isArray(profile.pinnedVideos)
                ? profile.pinnedVideos.slice(0, 3)
                : Array.isArray(accountData.pinnedVideos) ? accountData.pinnedVideos.slice(0, 3) : [];
            [likedVideos, savedVideos] = await Promise.all([
                loadVideosByIds(Array.isArray(accountData.likedVideoIds) ? accountData.likedVideoIds : []),
                loadVideosByIds(Array.isArray(accountData.savedVideoIds) ? accountData.savedVideoIds : [])
            ]);
            
            await loadViewerActivities();

            loadProfileHeader();
            document.getElementById('follower-count').textContent = formatCount(followStats.followers);
            document.getElementById('following-count').textContent = formatCount(followStats.following);
            updateLikeCount();
            renderContent();

            document.getElementById('follower-btn').addEventListener('click', () => loadUsersModal('followers', user.uid));
            document.getElementById('following-btn').addEventListener('click', () => loadUsersModal('following', user.uid));
            document.getElementById('viewers-icon-button').addEventListener('click', () => loadUsersModal('viewers', user.uid));
            document.getElementById('users-modal-close').addEventListener('click', () => {
                document.getElementById('users-modal').classList.add('hidden');
                document.getElementById('users-modal').classList.remove('flex');
            });
        }

        function openProfileVideo(event) {
            const button = event.target.closest('.open-profile-video');
            if (!button) return;
            const videoId = button.dataset.id;
            const selectedVideo = renderedItems.find(video => video.id === videoId);
            if (!selectedVideo) return;
            const creatorVideos = selectedVideo.userId === user.uid
                ? uploads.filter(video => video.admin === 'yes')
                : renderedItems.filter(video => video.userId === selectedVideo.userId);
            videoViewer.open(creatorVideos.map(video => ({
                ...video,
                creatorUsername: video.userId === user.uid
                    ? (profile.username ? `@${profile.username}` : profile.fullName || user.displayName)
                    : video.username ? `@${String(video.username).replace(/^@/, '')}` : video.uploadedBy || 'Creator',
                creatorVerified: video.userId === user.uid
                    ? profile.verify === 'yes'
                    : video.verify === 'yes' || video.creatorVerified === true,
                creatorAvatar: video.userId === user.uid
                    ? profile.profilePic || user.photoURL || ''
                    : video.profilePic || video.creatorAvatar || '',
                creatorProfileHref: video.userId
                    ? `./view-profile.html?uid=${encodeURIComponent(video.userId)}`
                    : ''
            })), videoId);
        }
        document.getElementById('content-grid').addEventListener('click', openProfileVideo);
        document.getElementById('content-grid').addEventListener('keydown', event => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            openProfileVideo(event);
        });

        document.querySelectorAll('.content-tab').forEach(button => button.addEventListener('click', () => {
            activeTab = button.dataset.tab;
            renderContent();
        }));
        document.querySelectorAll('.upload-filter').forEach(button => button.addEventListener('click', () => {
            activeFilter = button.dataset.filter;
            document.querySelectorAll('.upload-filter').forEach(filter => {
                filter.classList.toggle('bg-zinc-800', filter === button);
                filter.classList.toggle('text-zinc-500', filter !== button);
            });
            renderContent();
        }));
        document.getElementById('edit-profile-button').addEventListener('click', () => editDialog.showModal());
        document.getElementById('cancel-edit').addEventListener('click', () => editDialog.close());
        document.getElementById('profile-pic-button').addEventListener('click', () => editDialog.showModal());
        document.getElementById('profile-file').addEventListener('change', () => {
            const file = document.getElementById('profile-file').files[0];
            if (file) {
                const image = document.getElementById('profile-pic');
                image.src = URL.createObjectURL(file);
            }
        });
        document.getElementById('edit-form').addEventListener('submit', async event => {
            event.preventDefault();
            const saveButton = document.getElementById('save-profile');
            const message = document.getElementById('edit-message');
            saveButton.disabled = true;
            saveButton.textContent = 'Saving…';
            try {
                let profilePic = profile.profilePic || '';
                const file = document.getElementById('profile-file').files[0];
                if (file) {
                    const body = new FormData();
                    body.append('file', file);
                    body.append('upload_preset', UPLOAD_PRESET);
                    body.append('folder', 'user_uploads');
                    const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body });
                    const result = await response.json();
                    if (!response.ok || !result.secure_url) throw new Error(result.error?.message || 'Could not upload profile picture.');
                    profilePic = result.secure_url;
                }
                const fullName = document.getElementById('edit-name').value.trim();
                const bio = document.getElementById('edit-bio').value.trim();
                await updateDoc(doc(db, 'users', user.uid), { fullName, bio, profilePic });
                await setDoc(doc(db, 'profiles', user.uid), {
                    uid: user.uid,
                    fullName,
                    username: profile.username || '',
                    usernameLower: (profile.username || '').toLowerCase(),
                    bio,
                    profilePic,
                    pinnedVideos
                }, { merge: true });
                await updateProfile(user, { displayName: fullName, photoURL: profilePic || null });
                profile = { ...profile, fullName, bio, profilePic };
                loadProfileHeader();
                editDialog.close();
            } catch (error) {
                console.error('Unable to save profile:', error);
                message.textContent = error.message || 'Could not save your profile.';
                message.className = 'rounded-xl border border-rose-900 bg-rose-950/50 p-3 text-sm text-rose-200';
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = 'Save changes';
            }
        });

        document.addEventListener('click', async event => {
            const pinButton = event.target.closest('.pin-video');
            const deleteButton = event.target.closest('.delete-upload');
            try {
                if (pinButton) {
                    const videoId = pinButton.dataset.id;
                    pinnedVideos = pinnedVideos.includes(videoId)
                        ? pinnedVideos.filter(id => id !== videoId)
                        : [...pinnedVideos, videoId];
                    if (pinnedVideos.length > 3) {
                        pinnedVideos = pinnedVideos.slice(-3);
                        window.alert('You can pin up to three published posts. The oldest pin was removed.');
                    }
                    await updateDoc(doc(db, 'users', user.uid), { pinnedVideos });
                    await setDoc(doc(db, 'profiles', user.uid), { pinnedVideos }, { merge: true });
                    profile.pinnedVideos = pinnedVideos;
                    renderContent();
                } else if (deleteButton && window.confirm('Delete this upload? This cannot be undone.')) {
                    const deletedId = deleteButton.dataset.id;
                    await deleteDoc(doc(db, 'videos', deletedId));
                    uploads = uploads.filter(video => video.id !== deletedId);
                    updateLikeCount();
                    if (pinnedVideos.includes(deletedId)) {
                        pinnedVideos = pinnedVideos.filter(id => id !== deletedId);
                        profile.pinnedVideos = pinnedVideos;
                        await updateDoc(doc(db, 'users', user.uid), { pinnedVideos });
                        await setDoc(doc(db, 'profiles', user.uid), { pinnedVideos }, { merge: true });
                    }
                    renderContent();
                }
            } catch (error) {
                showError(error);
            }
        });

        onAuthStateChanged(auth, async currentUser => {
            unsubscribeUnreadMessages?.();
            unsubscribeUnreadMessages = subscribeToUnreadMessages(db, currentUser?.uid);
            if (!currentUser) {
                const returnTo = `${location.pathname}${location.search}`;
                location.replace(`./oauth.html?returnTo=${encodeURIComponent(returnTo)}`);
                return;
            }
            user = currentUser;
            try {
                await loadProfile();
            } catch (error) {
                showError(error);
            }
        });
    </script>
</body>
</html>
