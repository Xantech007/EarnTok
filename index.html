<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TikTok - Make Your Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
    <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black text-white font-sans antialiased select-none overflow-hidden">

<div id="app" class="relative w-full h-full max-w-md mx-auto bg-tiktok-dark overflow-hidden flex flex-col shadow-2xl border-x border-gray-900">

    <!-- TOP HEADER -->
    <header class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between px-4 pb-3 safe-top bg-gradient-to-b from-black/80 via-black/40 to-transparent">
        <a href="live.html" aria-label="Live" class="flex items-center space-x-1 text-white/90 hover:text-white transition">
            <i data-lucide="tv" class="w-6 h-6"></i>
            <span class="text-xs font-semibold uppercase tracking-wider hidden sm:inline">LIVE</span>
        </a>
        <div class="flex items-center space-x-5 text-base font-bold">
            <button data-action="tab" data-tab="following" id="tab-following" class="relative text-white/60 hover:text-white transition py-1">
                Following
                <span id="indicator-following" class="hidden absolute bottom-0 left-1/2 -translate-x-1/2 w-6 h-0.5 bg-tiktok-cyan rounded-full"></span>
            </button>
            <span class="text-white/30 text-xs">|</span>
            <button data-action="tab" data-tab="foryou" id="tab-foryou" class="relative text-white py-1">
                For You
                <span id="indicator-foryou" class="absolute bottom-0 left-1/2 -translate-x-1/2 w-6 h-0.5 bg-tiktok-red rounded-full"></span>
            </button>
        </div>
        <a href="search.html" aria-label="Search" class="text-white/90 hover:text-white transition">
            <i data-lucide="search" class="w-6 h-6"></i>
        </a>
    </header>

    <!-- FEED (cards are rendered by JS) -->
    <main id="video-feed" class="w-full flex-1 min-h-0 overflow-y-scroll snap-y-mandatory no-scrollbar relative">
        <div class="h-full flex items-center justify-center text-gray-400 text-sm">Loading videos…</div>
    </main>

    <!-- BOTTOM NAV (filled by ui.js) -->
    <nav id="nav-root"></nav>

    <!-- Guest login pill -->
    <a id="guest-login" href="login.html" class="hidden absolute top-16 left-4 z-30 bg-tiktok-red hover:bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-lg transition">Log in</a>

    <!-- Mute -->
    <button id="mute-btn" data-action="mute" aria-label="Toggle sound" class="absolute top-16 right-4 z-30 bg-black/40 hover:bg-black/60 backdrop-blur-md p-2 rounded-full text-white transition">
        <i data-lucide="volume-x" id="mute-icon" class="w-5 h-5"></i>
    </button>

    <!-- Backdrop for drawers -->
    <div id="backdrop" data-action="close-all" class="hidden fixed inset-0 z-40 bg-black/50"></div>

    <!-- COMMENTS DRAWER -->
    <div id="comment-drawer" class="fixed inset-x-0 bottom-0 max-w-md mx-auto z-50 transform translate-y-full transition-transform duration-300 ease-in-out bg-tiktok-dark rounded-t-2xl shadow-2xl flex flex-col border-t border-gray-800" style="height:70vh;height:70dvh;padding-bottom:env(safe-area-inset-bottom)">
        <div class="p-3 border-b border-gray-800 flex items-center justify-between text-center relative">
            <div class="w-10 h-1 bg-gray-600 rounded-full absolute top-2 left-1/2 -translate-x-1/2"></div>
            <h4 id="drawer-comment-count" class="w-full text-center text-xs font-bold pt-2 text-gray-200">Comments</h4>
            <button data-action="close-all" aria-label="Close comments" class="absolute right-3 top-3 text-gray-400 hover:text-white p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div id="comments-list" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar"></div>
        <div class="p-3 border-t border-gray-800 bg-black/50 flex items-center space-x-2">
            <img id="comment-avatar" src="" alt="" class="w-8 h-8 rounded-full object-cover">
            <input id="comment-input" type="text" maxlength="500" placeholder="Add comment..." class="flex-1 bg-gray-800 text-white text-sm rounded-full px-4 py-2 focus:outline-none focus:ring-1 focus:ring-tiktok-red">
            <button data-action="post-comment" class="text-tiktok-red hover:text-red-400 font-bold text-sm px-2">Post</button>
        </div>
    </div>

    <!-- SHARE SHEET -->
    <div id="share-modal" class="fixed inset-x-0 bottom-0 max-w-md mx-auto z-50 transform translate-y-full transition-transform duration-300 ease-in-out bg-tiktok-dark rounded-t-2xl p-4 border-t border-gray-800 hidden" style="padding-bottom:max(1rem,env(safe-area-inset-bottom))">
        <div class="flex justify-between items-center mb-4">
            <h4 class="text-sm font-bold">Share to</h4>
            <button data-action="close-all" aria-label="Close share" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="grid grid-cols-4 gap-4 text-center text-xs mb-2">
            <button data-action="copy-link" class="flex flex-col items-center space-y-1 group">
                <div class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center group-hover:bg-gray-700 transition"><i data-lucide="link" class="w-6 h-6 text-tiktok-cyan"></i></div>
                <span>Copy link</span>
            </button>
            <a id="share-whatsapp" href="#" target="_blank" rel="noopener" class="flex flex-col items-center space-y-1 group">
                <div class="w-12 h-12 rounded-full bg-green-600 flex items-center justify-center group-hover:bg-green-500 transition"><i data-lucide="message-circle" class="w-6 h-6"></i></div>
                <span>WhatsApp</span>
            </a>
            <a id="share-x" href="#" target="_blank" rel="noopener" class="flex flex-col items-center space-y-1 group">
                <div class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center group-hover:bg-gray-700 transition"><i data-lucide="twitter" class="w-6 h-6"></i></div>
                <span>X</span>
            </a>
            <button data-action="native-share" class="flex flex-col items-center space-y-1 group">
                <div class="w-12 h-12 rounded-full bg-tiktok-red flex items-center justify-center group-hover:bg-red-600 transition"><i data-lucide="share" class="w-6 h-6"></i></div>
                <span>More</span>
            </button>
        </div>
    </div>
</div>

<script type="module">
import {
    authReady, requireAuth, loginUrlFor, getMe, avatarOf, defaultAvatar, getMyState,
    fetchVideos, fetchVideo, fetchFollowingVideos, toggleLike, toggleBookmark, toggleFollow,
    fetchComments, addComment,
} from './firebase.js';
import { escapeHTML as esc, formatNumber, timeAgo, toast, icons, renderNav } from './ui.js';

/* ---------- Demo content shown until real videos exist in Firestore ---------- */
const DEMO = [
    { id: 'demo-1', demo: true, username: 'alex_cyberpunk', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80',
      videoURL: 'https://assets.mixkit.co/videos/preview/mixkit-tokyo-street-with-neon-lights-at-night-42232-large.mp4',
      poster: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80',
      description: 'Exploring the neon city at midnight! 🌃 High energy vibes always #cyberpunk #neon #citylights',
      audio: 'Original Sound - @alex_cyberpunk', likesCount: 142500, commentsCount: 3, bookmarksCount: 18400, sharesCount: 4120 },
    { id: 'demo-2', demo: true, username: 'chef_mario', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80',
      videoURL: 'https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-slice-of-pizza-42823-large.mp4',
      poster: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80',
      description: 'Making the ULTIMATE crispy artisan garlic bread 🥖🧄 Would you eat this whole loaf? #foodie #recipe',
      audio: 'Delicious Cooking Beats - Chef Mario', likesCount: 892000, commentsCount: 2, bookmarksCount: 52100, sharesCount: 12800 },
    { id: 'demo-3', demo: true, username: 'nature_escapes', avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=150&q=80',
      videoURL: 'https://assets.mixkit.co/videos/preview/mixkit-forest-stream-in-the-sunlight-529-large.mp4',
      poster: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80',
      description: 'Serene sunset above the clouds in the Swiss Alps 🏔️ Real peace exists right here. #travel #mountains',
      audio: 'Chill Lofi Ambient Rain - Nature Escapes', likesCount: 320100, commentsCount: 1, bookmarksCount: 31200, sharesCount: 8900 },
];
const DEMO_COMMENTS = {
    'demo-1': [
        { username: 'cyber_fan', text: 'This lighting setup is insane 🔥!' },
        { username: 'tokyo_drift', text: 'Where in Tokyo was this shot?' },
        { username: 'synthwave_boy', text: 'Adding this song to my playlist right now!' },
    ],
    'demo-2': [
        { username: 'foodie_101', text: 'I can literally smell this video 🤤🥖' },
        { username: 'baker_sam', text: 'Needs more garlic powder! Jk looks delicious!' },
    ],
    'demo-3': [{ username: 'hiker_dave', text: 'Heaven on earth ⛰️☁️' }],
};

/* ---------- State ---------- */
let me = null;                       // signed-in user or null (guest)
let liked = new Set(), saved = new Set(), following = new Set();
let videos = [];
let tab = 'foryou';
let activeId = null;
let isMuted = true;
let observer = null;

const feed = document.getElementById('video-feed');
const byId = (id) => videos.find((v) => v.id === id);
const cardOf = (id) => feed.querySelector(`.video-card[data-id="${CSS.escape(id)}"]`);
const enc = encodeURIComponent;
const linkify = (t = '') => esc(t).replace(/(^|\s)#(\w+)/g,
    (_, sp, tag) => `${sp}<a href="search.html?q=%23${tag}" class="font-semibold text-tiktok-cyan">#${tag}</a>`);

/* ---------- Rendering ---------- */
function cardHTML(v) {
    const own = me && v.uid === me.uid;
    const showFollow = !own && !following.has(v.uid);
    const profileHref = `profile.html?user=${enc(v.username || '')}`;
    const audioHref = `search.html?q=${enc(v.audio || '')}`;
    return `
    <section class="video-card snap-start relative w-full h-full flex-shrink-0 bg-black overflow-hidden" data-id="${esc(v.id)}">
        <video class="video-player w-full h-full object-cover cursor-pointer" loop playsinline muted preload="metadata" ${v.poster ? `poster="${esc(v.poster)}"` : ''}>
            <source src="${esc(v.videoURL)}" type="video/mp4">
        </video>
        <div class="play-icon-overlay absolute inset-0 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
            <div class="w-16 h-16 bg-black/50 rounded-full flex items-center justify-center backdrop-blur-sm">
                <i data-lucide="play" class="w-8 h-8 text-white fill-white ml-1"></i>
            </div>
        </div>

        <div class="absolute right-3 bottom-6 z-20 flex flex-col items-center space-y-5">
            <div class="relative">
                <a href="${profileHref}" aria-label="View @${esc(v.username)}">
                    <img src="${esc(v.avatar || defaultAvatar(v.username))}" alt="" class="w-12 h-12 rounded-full border-2 border-white object-cover shadow-lg">
                </a>
                ${showFollow ? `<button data-action="follow" aria-label="Follow" class="follow-btn absolute -bottom-1.5 left-1/2 -translate-x-1/2 bg-tiktok-red hover:bg-red-600 text-white rounded-full p-0.5 shadow-md transition active:scale-90"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>` : ''}
            </div>

            <div class="flex flex-col items-center">
                <button data-action="like" aria-label="Like" class="like-btn ${liked.has(v.id) ? 'active' : ''} p-2 rounded-full hover:bg-white/10 transition active:scale-75 text-white">
                    <i data-lucide="heart" class="w-8 h-8 drop-shadow-md"></i>
                </button>
                <span class="like-count text-xs font-semibold drop-shadow-md mt-0.5">${formatNumber(v.likesCount)}</span>
            </div>

            <div class="flex flex-col items-center">
                <button data-action="comment" aria-label="Comments" class="p-2 rounded-full hover:bg-white/10 transition active:scale-75 text-white">
                    <i data-lucide="message-circle" class="w-8 h-8 drop-shadow-md"></i>
                </button>
                <span class="comment-count text-xs font-semibold drop-shadow-md mt-0.5">${formatNumber(v.commentsCount)}</span>
            </div>

            <div class="flex flex-col items-center">
                <button data-action="bookmark" aria-label="Save" class="bookmark-btn ${saved.has(v.id) ? 'active' : ''} p-2 rounded-full hover:bg-white/10 transition active:scale-75 text-white">
                    <i data-lucide="bookmark" class="w-8 h-8 drop-shadow-md"></i>
                </button>
                <span class="bookmark-count text-xs font-semibold drop-shadow-md mt-0.5">${formatNumber(v.bookmarksCount)}</span>
            </div>

            <div class="flex flex-col items-center">
                <button data-action="share" aria-label="Share" class="p-2 rounded-full hover:bg-white/10 transition active:scale-75 text-white">
                    <i data-lucide="share-2" class="w-8 h-8 drop-shadow-md"></i>
                </button>
                <span class="text-xs font-semibold drop-shadow-md mt-0.5">${formatNumber(v.sharesCount)}</span>
            </div>

            <a href="${audioHref}" aria-label="Videos with this sound" class="mt-2 block">
                <div class="w-10 h-10 rounded-full bg-gray-900 border-2 border-gray-700 flex items-center justify-center animate-spin-slow music-disc-glow overflow-hidden">
                    <img src="${esc(v.avatar || defaultAvatar(v.username))}" alt="" class="w-6 h-6 rounded-full object-cover">
                </div>
            </a>
        </div>

        <div class="absolute bottom-2 left-0 right-16 z-20 p-4 bg-gradient-to-t from-black/80 via-black/30 to-transparent pointer-events-none">
            <div class="pointer-events-auto">
                <a href="${profileHref}" class="font-bold text-base drop-shadow-md hover:underline inline-block">@${esc(v.username)}</a>
                <p class="text-sm mt-1 text-gray-100 line-clamp-2 leading-snug drop-shadow-sm">${linkify(v.description)}</p>
                <a href="${audioHref}" class="flex items-center space-x-2 mt-3 text-xs font-medium text-gray-200">
                    <i data-lucide="music" class="w-3.5 h-3.5 animate-pulse text-tiktok-cyan"></i>
                    <div class="overflow-hidden w-48 relative h-4">
                        <div class="whitespace-nowrap animate-marquee absolute inset-0">${esc(v.audio || '')} &bull; ${esc(v.audio || '')}</div>
                    </div>
                </a>
            </div>
        </div>
    </section>`;
}

function renderFeed(list, emptyHTML) {
    videos = list;
    if (observer) observer.disconnect();
    feed.innerHTML = list.length ? list.map(cardHTML).join('') : (emptyHTML || '');
    icons();
    feed.scrollTop = 0;
    observe();
}

function observe() {
    observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            const video = entry.target.querySelector('video');
            if (entry.isIntersecting) {
                activeId = entry.target.dataset.id;
                video.muted = isMuted;
                video.play().catch(() => {});
            } else {
                video.pause();
                video.currentTime = 0;
                entry.target.querySelector('.play-icon-overlay').classList.add('opacity-0');
            }
        });
    }, { threshold: 0.6 });
    feed.querySelectorAll('.video-card').forEach((c) => observer.observe(c));
}

/* ---------- Loading feeds ---------- */
async function loadFeed(which) {
    feed.innerHTML = '<div class="h-full flex items-center justify-center text-gray-400 text-sm">Loading videos…</div>';
    try {
        if (which === 'following') {
            const list = await fetchFollowingVideos(me.uid);
            renderFeed(list, `<div class="h-full flex flex-col items-center justify-center text-center px-8 text-gray-300 space-y-4">
                <p class="text-sm">No videos from people you follow yet.</p>
                <a href="friends.html?tab=suggested" class="bg-tiktok-red px-5 py-2 rounded-md font-semibold text-sm">Find people to follow</a></div>`);
            return;
        }
        let list = [];
        try { list = await fetchVideos(20); } catch (e) { console.warn('Feed unavailable, using demo videos', e); }
        if (!list.length) list = DEMO;

        // Deep link: index.html?v=<videoId> puts that video first
        const wanted = new URLSearchParams(location.search).get('v');
        if (wanted) {
            const v = list.find((x) => x.id === wanted) || await fetchVideo(wanted).catch(() => null);
            if (v) list = [v, ...list.filter((x) => x.id !== v.id)];
        }
        renderFeed(list);
    } catch (e) {
        console.error(e);
        renderFeed(DEMO);
    }
}

/* ---------- Actions (guest-gated where needed) ---------- */
const gate = (msg, id = activeId) => requireAuth(msg, id && !String(id).startsWith('demo') ? `index.html?v=${id}` : 'index.html');

async function doLike(card) {
    const v = byId(card.dataset.id);
    if (!gate('Log in to like videos', v.id)) return;
    const was = liked.has(v.id);
    setLiked(card, v, !was);
    if (v.demo) return;
    try { await toggleLike(v.id, was); } catch (e) { setLiked(card, v, was); toast('Could not update like'); console.error(e); }
}
function setLiked(card, v, on) {
    on ? liked.add(v.id) : liked.delete(v.id);
    v.likesCount = Math.max(0, (v.likesCount || 0) + (on ? 1 : -1));
    const btn = card.querySelector('.like-btn');
    btn.classList.toggle('active', on);
    btn.classList.toggle('animate-heart-bounce', on);
    card.querySelector('.like-count').textContent = formatNumber(v.likesCount);
}

async function doBookmark(card) {
    const v = byId(card.dataset.id);
    if (!gate('Log in to save videos', v.id)) return;
    const was = saved.has(v.id);
    was ? saved.delete(v.id) : saved.add(v.id);
    v.bookmarksCount = Math.max(0, (v.bookmarksCount || 0) + (was ? -1 : 1));
    card.querySelector('.bookmark-btn').classList.toggle('active', !was);
    card.querySelector('.bookmark-count').textContent = formatNumber(v.bookmarksCount);
    toast(was ? 'Removed from Favorites' : 'Saved to Favorites');
    if (v.demo) return;
    try { await toggleBookmark(v.id, was); } catch (e) { toast('Could not save'); console.error(e); }
}

async function doFollow(card, btn) {
    const v = byId(card.dataset.id);
    if (!gate('Log in to follow creators', v.id)) return;
    if (v.demo || !v.uid) { toast('Demo creator — upload a video to create real ones'); return; }
    try {
        await toggleFollow(v.uid, false);
        following.add(v.uid);
        feed.querySelectorAll('.video-card').forEach((c) => {
            if (byId(c.dataset.id)?.uid === v.uid) c.querySelector('.follow-btn')?.remove();
        });
        toast('Following @' + v.username);
    } catch (e) { toast('Could not follow'); console.error(e); }
}

/* ---------- Comments ---------- */
const drawer = document.getElementById('comment-drawer');
const backdrop = document.getElementById('backdrop');
const shareModal = document.getElementById('share-modal');

const commentHTML = (c) => `
    <div class="flex items-start space-x-3">
        <a href="profile.html?user=${enc(c.username)}"><img src="${esc(c.avatar || defaultAvatar(c.username))}" alt="" class="w-8 h-8 rounded-full object-cover"></a>
        <div class="flex-1 text-xs min-w-0">
            <a href="profile.html?user=${enc(c.username)}" class="font-bold text-gray-400">@${esc(c.username)}</a>
            <p class="text-white mt-0.5 break-words">${esc(c.text)}</p>
            <span class="text-[10px] text-gray-500">${c.createdAt === undefined ? '' : timeAgo(c.createdAt)}</span>
        </div>
    </div>`;

async function openComments(id) {
    const v = byId(id);
    const list = document.getElementById('comments-list');
    document.getElementById('comment-avatar').src = me ? avatarOf(me) : defaultAvatar('?');
    document.getElementById('drawer-comment-count').textContent = `${formatNumber(v.commentsCount)} comments`;
    list.innerHTML = '<p class="text-center text-xs text-gray-500">Loading…</p>';
    backdrop.classList.remove('hidden');
    drawer.classList.remove('translate-y-full');
    try {
        const items = v.demo ? DEMO_COMMENTS[id] || [] : await fetchComments(id);
        list.innerHTML = items.length ? items.map(commentHTML).join('') : '<p class="text-center text-xs text-gray-500 pt-6">No comments yet. Be the first!</p>';
    } catch (e) {
        list.innerHTML = '<p class="text-center text-xs text-gray-500 pt-6">Could not load comments.</p>';
        console.error(e);
    }
}

async function postComment() {
    const input = document.getElementById('comment-input');
    const text = input.value.trim();
    if (!gate('Log in to comment')) return;     // guests are sent to login.html
    if (!text) return;
    const v = byId(activeId);
    const list = document.getElementById('comments-list');
    try {
        const profile = await getMe();
        const c = v.demo
            ? { username: profile.username, avatar: avatarOf(profile), text, createdAt: null }
            : await addComment(v.id, profile, text);
        if (list.querySelector('p.pt-6')) list.innerHTML = '';
        list.insertAdjacentHTML('afterbegin', commentHTML(c));
        input.value = '';
        v.commentsCount = (v.commentsCount || 0) + 1;
        const txt = formatNumber(v.commentsCount);
        cardOf(v.id).querySelector('.comment-count').textContent = txt;
        document.getElementById('drawer-comment-count').textContent = `${txt} comments`;
    } catch (e) { toast('Could not post comment'); console.error(e); }
}

// Focusing the comment box as a guest also goes to login
document.getElementById('comment-input').addEventListener('focus', () => { if (!me) gate('Log in to comment'); });
document.getElementById('comment-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') postComment(); });

/* ---------- Share ---------- */
function openShare(id) {
    const v = byId(id);
    const url = new URL(`index.html?v=${enc(id)}`, location.href).href;
    const text = `Check out @${v.username} on TikTok`;
    shareModal.dataset.url = url;
    document.getElementById('share-whatsapp').href = `https://wa.me/?text=${enc(text + ' ' + url)}`;
    document.getElementById('share-x').href = `https://twitter.com/intent/tweet?text=${enc(text)}&url=${enc(url)}`;
    backdrop.classList.remove('hidden');
    shareModal.classList.remove('hidden');
    void shareModal.offsetHeight;                 // force reflow so the slide-in transition runs
    shareModal.classList.remove('translate-y-full');
}

function closeAll() {
    drawer.classList.add('translate-y-full');
    shareModal.classList.add('translate-y-full');
    backdrop.classList.add('hidden');
    setTimeout(() => shareModal.classList.add('hidden'), 300);
}

async function copyLink() {
    const url = shareModal.dataset.url;
    try { await navigator.clipboard.writeText(url); }
    catch { const i = Object.assign(document.createElement('input'), { value: url }); document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); }
    closeAll();
    toast('Link copied to clipboard!');
}

/* ---------- Mute / play / double-tap ---------- */
function toggleMute() {
    isMuted = !isMuted;
    feed.querySelectorAll('video').forEach((v) => (v.muted = isMuted));
    document.getElementById('mute-icon').setAttribute('data-lucide', isMuted ? 'volume-x' : 'volume-2');
    icons();
    toast(isMuted ? 'Sound off' : 'Sound on');
}

function togglePlay(card) {
    const video = card.querySelector('video');
    const overlay = card.querySelector('.play-icon-overlay');
    if (video.paused) { video.play(); overlay.classList.add('opacity-0'); }
    else { video.pause(); overlay.classList.remove('opacity-0'); }
}

function spawnHeart(e, card) {
    const r = card.getBoundingClientRect();
    const h = document.createElement('div');
    h.className = 'floating-heart text-tiktok-red';
    h.style.setProperty('--rot', `${(Math.random() - 0.5) * 40}deg`);
    h.style.left = `${e.clientX - r.left}px`;
    h.style.top = `${e.clientY - r.top}px`;
    h.innerHTML = '<svg class="w-20 h-20 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
    card.appendChild(h);
    setTimeout(() => h.remove(), 900);
}

// One handler for both: single tap = play/pause (delayed), double tap = like
let lastTap = 0, tapTimer = null;
feed.addEventListener('click', (e) => {
    if (e.target.closest('a, button')) return;
    const card = e.target.closest('.video-card');
    if (!card) return;
    const now = Date.now();
    if (now - lastTap < 300) {
        clearTimeout(tapTimer); lastTap = 0;
        const v = byId(card.dataset.id);
        if (!gate('Log in to like videos', v.id)) return;
        spawnHeart(e, card);
        if (!liked.has(v.id)) doLike(card);
    } else {
        lastTap = now;
        tapTimer = setTimeout(() => togglePlay(card), 300);
    }
});

/* ---------- Tabs ---------- */
function switchTab(t) {
    if (t === 'following' && !me) { requireAuth('Log in to see people you follow', 'index.html'); return; }
    tab = t;
    const f = t === 'following';
    document.getElementById('indicator-following').classList.toggle('hidden', !f);
    document.getElementById('indicator-foryou').classList.toggle('hidden', f);
    document.getElementById('tab-following').className = `relative py-1 ${f ? 'text-white' : 'text-white/60 hover:text-white transition'}`;
    document.getElementById('tab-foryou').className = `relative py-1 ${f ? 'text-white/60 hover:text-white transition' : 'text-white'}`;
    loadFeed(t);
}

/* ---------- Event delegation (module scripts can't use inline onclick) ---------- */
document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const card = el.closest('.video-card');
    switch (el.dataset.action) {
        case 'like': doLike(card); break;
        case 'bookmark': doBookmark(card); break;
        case 'follow': doFollow(card, el); break;
        case 'comment': activeId = card.dataset.id; openComments(activeId); break;
        case 'share': activeId = card.dataset.id; openShare(activeId); break;
        case 'post-comment': postComment(); break;
        case 'copy-link': copyLink(); break;
        case 'native-share':
            if (navigator.share) navigator.share({ url: shareModal.dataset.url }).catch(() => {});
            else copyLink();
            break;
        case 'mute': toggleMute(); break;
        case 'tab': switchTab(el.dataset.tab); break;
        case 'close-all': closeAll(); break;
    }
});

document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const card = activeId && cardOf(activeId);
    if (e.key === 'ArrowDown' || e.key === 'j') feed.scrollBy({ top: feed.clientHeight, behavior: 'smooth' });
    else if (e.key === 'ArrowUp' || e.key === 'k') feed.scrollBy({ top: -feed.clientHeight, behavior: 'smooth' });
    else if (e.key === ' ' && card) { e.preventDefault(); togglePlay(card); }
    else if (e.key.toLowerCase() === 'l' && card) doLike(card);
    else if (e.key.toLowerCase() === 'm') toggleMute();
    else if (e.key === 'Escape') closeAll();
});

/* ---------- Boot ---------- */
(async function init() {
    icons();
    me = await authReady;                         // null = guest, which is allowed here
    renderNav('home');
    if (!me) document.getElementById('guest-login').classList.remove('hidden');
    else {
        try { ({ liked, saved, following } = await getMyState(me.uid)); } catch (e) { console.warn(e); }
    }
    await loadFeed('foryou');
})();
</script>
