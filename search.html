<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>EarnTok · Search</title>
    <link rel="icon" type="image/png" href="./earntok-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { color-scheme: light; }
        body { min-height: 100vh; }
        img.rounded-full { object-fit: cover !important; aspect-ratio: 1 / 1 !important; }
        .search-filter.active { border-color: #161823; color: #161823; font-weight: 700; }
    </style>
</head>
<body class="flex min-h-screen flex-col bg-white text-zinc-900 antialiased">
    <header class="sticky top-0 z-20 border-b border-zinc-100 bg-white/95 backdrop-blur">
        <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
            <a href="./index.html" class="p-1 text-zinc-900 hover:opacity-80" aria-label="Back to feed">
                <i data-lucide="arrow-left" class="h-6 w-6 stroke-[2.5]" aria-hidden="true"></i>
            </a>
            <h1 class="text-lg font-bold tracking-tight">Search</h1>
            <a href="./inbox.html" class="relative p-1 text-zinc-900 hover:text-rose-500" aria-label="Inbox">
                <i data-lucide="message-square" class="h-6 w-6" aria-hidden="true"></i>
                <span data-unread-message-badge class="absolute -right-1 -top-1 hidden min-w-4 h-4 items-center justify-center rounded-full bg-rose-500 px-1 text-[10px] font-bold leading-none text-white" aria-hidden="true"></span>
            </a>
        </div>
    </header>

    <main class="mx-auto w-full max-w-3xl flex-1 px-4 pb-24 pt-4">
        <form id="search-form" class="relative">
            <i data-lucide="search" class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-zinc-400" aria-hidden="true"></i>
            <input id="search-input" type="search" autocomplete="off" placeholder="Search accounts, videos, and photos" class="w-full rounded-full border border-zinc-200 bg-zinc-100 py-3 pl-12 pr-12 text-sm outline-none transition focus:border-zinc-300 focus:bg-white focus:ring-2 focus:ring-rose-100" aria-label="Search EarnTok">
            <button id="clear-search-button" type="button" class="absolute right-3 top-1/2 hidden -translate-y-1/2 rounded-full p-1 text-zinc-400 hover:bg-zinc-200 hover:text-zinc-700" aria-label="Clear search">
                <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
            </button>
        </form>

        <div id="search-filters" class="mt-4 flex gap-2 overflow-x-auto pb-2" aria-label="Search categories">
            <button type="button" data-filter="all" class="search-filter active shrink-0 rounded-full border border-zinc-300 px-4 py-2 text-sm text-zinc-500">Top</button>
            <button type="button" data-filter="accounts" class="search-filter shrink-0 rounded-full border border-zinc-200 px-4 py-2 text-sm text-zinc-500">Accounts</button>
            <button type="button" data-filter="videos" class="search-filter shrink-0 rounded-full border border-zinc-200 px-4 py-2 text-sm text-zinc-500">Videos</button>
            <button type="button" data-filter="photos" class="search-filter shrink-0 rounded-full border border-zinc-200 px-4 py-2 text-sm text-zinc-500">Photos</button>
        </div>

        <p id="search-error" class="hidden my-3 rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm text-rose-600" role="alert"></p>
        <section id="recent-searches" class="mt-2">
            <div class="flex items-center justify-between border-b border-zinc-100 py-3">
                <h2 class="text-sm font-bold">Recent searches</h2>
                <button id="clear-history-button" type="button" class="text-xs font-semibold text-rose-500 hover:text-rose-600">Clear all</button>
            </div>
            <div id="recent-search-list" class="divide-y divide-zinc-100"></div>
            <p id="search-suggestions" class="py-10 text-center text-sm text-zinc-500">Find creators, published videos, and photos on EarnTok.</p>
        </section>
        <section id="search-results" class="hidden mt-2">
            <div id="results-heading" class="border-b border-zinc-100 py-3 text-sm font-semibold text-zinc-500"></div>
            <div id="results-content" class="space-y-5 py-3"></div>
        </section>
    </main>

    <nav class="fixed inset-x-0 bottom-0 z-30 flex items-center justify-around border-t border-zinc-200 bg-white px-3 pt-2 pb-[max(.5rem,env(safe-area-inset-bottom))] text-xs font-medium shadow-[0_-4px_16px_rgba(0,0,0,.06)]">
        <a href="./index.html" class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-black" aria-label="Home">
            <i data-lucide="home" class="h-6 w-6" aria-hidden="true"></i><span>Home</span>
        </a>
        <a href="./friends.html" class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-black" aria-label="Friends">
            <i data-lucide="users" class="h-6 w-6" aria-hidden="true"></i><span>Friends</span>
        </a>
        <a href="./index.html?openCreate=1" class="group relative flex h-8 w-[54px] items-center justify-center" aria-label="Create a video or photo">
            <span class="absolute left-0 z-0 h-7 w-[45px] rounded-lg bg-cyan-400"></span>
            <span class="absolute right-0 z-0 h-7 w-[45px] rounded-lg bg-rose-500"></span>
            <span class="relative z-10 flex h-7 w-11 items-center justify-center rounded-lg bg-black text-white">
                <i data-lucide="plus" class="h-5 w-5 stroke-[3]" aria-hidden="true"></i>
            </span>
        </a>
        <a href="./inbox.html" class="relative flex flex-col items-center space-y-0.5 text-gray-400 hover:text-black" aria-label="Inbox">
            <i data-lucide="message-square" class="h-6 w-6" aria-hidden="true"></i>
            <span data-unread-message-badge class="absolute right-2 top-0 hidden min-w-4 h-4 items-center justify-center rounded-full bg-rose-500 px-1 text-[10px] font-bold leading-none text-white" aria-hidden="true"></span>
            <span>Inbox</span>
        </a>
        <a href="./profile.html" class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-black" aria-label="Profile">
            <i data-lucide="user" class="h-6 w-6" aria-hidden="true"></i><span>Profile</span>
        </a>
    </nav>

    <script type="module">
        import { auth, db } from './firebase.js';
        import { createProfileVideoViewer } from './profile-video-viewer.js';
        import { subscribeToUnreadMessages } from './unread-messages.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        lucide.createIcons();

        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const clearSearchButton = document.getElementById('clear-search-button');
        const recentSearches = document.getElementById('recent-searches');
        const recentSearchList = document.getElementById('recent-search-list');
        const searchSuggestions = document.getElementById('search-suggestions');
        const searchResults = document.getElementById('search-results');
        const resultsHeading = document.getElementById('results-heading');
        const resultsContent = document.getElementById('results-content');
        const searchError = document.getElementById('search-error');
        const viewer = createProfileVideoViewer({ auth, db });
        const historyKey = 'earntok_recent_searches';
        const defaultAvatar = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80';

        let profiles = [];
        let videos = [];
        let searchDataLoaded = false;
        let loadingSearchData = null;
        let activeFilter = 'all';
        let currentMatches = { accounts: [], videos: [], photos: [] };
        let unsubscribeUnreadMessages = null;
        let searchTimer = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&#38;', '<': '&#60;', '>': '&#62;', '"': '&#34;', "'": '&#39;'
            })[character]);
        }

        function isPhoto(video) {
            if (video.mediaType) return video.mediaType === 'image';
            return /\.(avif|gif|jpe?g|png|webp|bmp|heic)(?:\?|$)/i.test(video.link || '');
        }

        function dateValue(timestamp) {
            if (timestamp && typeof timestamp.toDate === 'function') return timestamp.toDate().getTime();
            if (timestamp instanceof Date) return timestamp.getTime();
            if (typeof timestamp === 'number') return timestamp;
            if (typeof timestamp === 'string') return new Date(timestamp).getTime() || 0;
            return 0;
        }

        function getHistory() {
            try {
                const value = JSON.parse(localStorage.getItem(historyKey) || '[]');
                return Array.isArray(value) ? value.filter(item => typeof item === 'string') : [];
            } catch (error) {
                console.warn('Could not read recent search history:', error);
                return [];
            }
        }

        function saveHistory(term) {
            const history = [term, ...getHistory().filter(item => item.toLowerCase() !== term.toLowerCase())].slice(0, 10);
            try {
                localStorage.setItem(historyKey, JSON.stringify(history));
            } catch (error) {
                console.error('Could not save recent search history:', error);
            }
            renderHistory();
        }

        function renderHistory() {
            const history = getHistory();
            document.getElementById('clear-history-button').classList.toggle('hidden', history.length === 0);
            searchSuggestions.classList.toggle('hidden', history.length > 0);
            recentSearchList.innerHTML = history.map(term => `
                <div class="flex items-center gap-3 py-3">
                    <i data-lucide="clock-3" class="h-4 w-4 shrink-0 text-zinc-400" aria-hidden="true"></i>
                    <button type="button" data-recent-search="${escapeHtml(term)}" class="min-w-0 flex-1 truncate text-left text-sm text-zinc-700">${escapeHtml(term)}</button>
                    <button type="button" data-remove-search="${escapeHtml(term)}" class="rounded-full p-1 text-zinc-400 hover:bg-zinc-100" aria-label="Remove recent search">
                        <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function loadSearchData() {
            if (searchDataLoaded) return;
            if (loadingSearchData) return loadingSearchData;
            loadingSearchData = Promise.all([
                getDocs(collection(db, 'profiles')),
                getDocs(query(collection(db, 'videos'), where('admin', '==', 'yes')))
            ]).then(([profilesSnapshot, videosSnapshot]) => {
                profiles = profilesSnapshot.docs.map(item => ({ id: item.id, ...item.data() }));
                const profilesById = new Map(profiles.map(profile => [profile.id, profile]));
                videos = videosSnapshot.docs.map(item => {
                    const video = { id: item.id, ...item.data() };
                    const profile = profilesById.get(video.userId) || {};
                    return {
                        ...video,
                        creatorUsername: profile.username ? `@${profile.username}` : (video.username ? `@${video.username}` : video.uploadedBy || 'Creator'),
                        creatorAvatar: profile.profilePic || video.profileImageLink || '',
                        creatorVerified: profile.verify === 'yes',
                        creatorProfileHref: video.userId
                            ? `./view-profile.html?uid=${encodeURIComponent(video.userId)}`
                            : ''
                    };
                });
                searchDataLoaded = true;
            }).finally(() => {
                loadingSearchData = null;
            });
            return loadingSearchData;
        }

        function accountMatches(profile, term) {
            const searchable = [profile.fullName, profile.username, profile.bio]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();
            return searchable.includes(term);
        }

        function videoMatches(video, term) {
            return [video.description, video.username, video.uploadedBy]
                .filter(Boolean)
                .join(' ')
                .toLowerCase()
                .includes(term);
        }

        function renderAccounts(accounts) {
            if (!accounts.length) return '';
            return `<section>
                <h2 class="mb-2 text-sm font-bold text-zinc-900">Accounts</h2>
                <div class="divide-y divide-zinc-100">${accounts.slice(0, activeFilter === 'accounts' ? 50 : 5).map(profile => `
                    <a href="./view-profile.html?uid=${encodeURIComponent(profile.id)}" class="flex items-center gap-3 rounded-xl py-3 hover:bg-zinc-50">
                        <img src="${escapeHtml(profile.profilePic || defaultAvatar)}" alt="" class="h-11 w-11 shrink-0 rounded-full bg-zinc-200 object-cover" onerror="this.src='${defaultAvatar}'">
                        <span class="min-w-0 flex-1">
                            <span class="flex items-center gap-1">
                                <span class="truncate text-sm font-bold text-zinc-900">${escapeHtml(profile.fullName || 'EarnTok user')}</span>
                                ${profile.verify === 'yes' ? '<i data-lucide="badge-check" class="h-4 w-4 shrink-0 text-sky-500"></i>' : ''}
                            </span>
                            <span class="block truncate text-xs text-zinc-500">${escapeHtml(profile.username ? `@${profile.username}` : '')}</span>
                        </span>
                        <i data-lucide="chevron-right" class="h-4 w-4 text-zinc-300" aria-hidden="true"></i>
                    </a>
                `).join('')}</div>
            </section>`;
        }

        function renderMedia(matchingVideos, matchingPhotos) {
            const showVideos = activeFilter === 'all' || activeFilter === 'videos';
            const showPhotos = activeFilter === 'all' || activeFilter === 'photos';
            const sections = [];
            for (const [kind, items, show] of [
                ['Videos', matchingVideos, showVideos],
                ['Photos', matchingPhotos, showPhotos]
            ]) {
                if (!show || !items.length) continue;
                const limitCount = activeFilter === 'all' ? 6 : 60;
                sections.push(`<section>
                    <h2 class="mb-2 text-sm font-bold text-zinc-900">${kind}</h2>
                    <div class="grid grid-cols-3 gap-1.5 sm:gap-2">${items.slice(0, limitCount).map(video => `
                        <button type="button" data-video-id="${escapeHtml(video.id)}" class="group relative aspect-[3/4] overflow-hidden rounded-lg bg-zinc-100 text-left">
                            ${isPhoto(video)
                                ? `<img src="${escapeHtml(video.link)}" alt="${escapeHtml(video.description || 'Photo')}" class="h-full w-full object-cover" loading="lazy">`
                                : video.thumbnail
                                    ? `<img src="${escapeHtml(video.thumbnail)}" alt="${escapeHtml(video.description || 'Video')}" class="h-full w-full object-cover" loading="lazy">`
                                    : `<video src="${escapeHtml(video.link)}" class="h-full w-full object-cover" muted playsinline preload="metadata"></video>`}
                            <span class="absolute inset-0 flex items-end bg-gradient-to-t from-black/70 via-transparent to-transparent p-2">
                                <span class="line-clamp-2 text-left text-[11px] font-medium text-white">${escapeHtml(video.description || (isPhoto(video) ? 'Photo' : 'Video'))}</span>
                            </span>
                            ${!isPhoto(video) ? '<i data-lucide="play" class="absolute right-2 top-2 h-4 w-4 fill-white text-white drop-shadow" aria-hidden="true"></i>' : ''}
                        </button>
                    `).join('')}</div>
                </section>`);
            }
            return sections.join('');
        }

        function renderResults(term) {
            const accounts = currentMatches.accounts;
            const matchingVideos = currentMatches.videos;
            const matchingPhotos = currentMatches.photos;
            const mediaCount = (activeFilter === 'videos' ? matchingVideos.length
                : activeFilter === 'photos' ? matchingPhotos.length
                    : matchingVideos.length + matchingPhotos.length);
            const count = activeFilter === 'accounts' ? accounts.length
                : activeFilter === 'videos' ? matchingVideos.length
                    : activeFilter === 'photos' ? matchingPhotos.length
                        : accounts.length + mediaCount;
            recentSearches.classList.add('hidden');
            searchResults.classList.remove('hidden');
            resultsHeading.textContent = `${count} result${count === 1 ? '' : 's'} for “${term}”`;
            if (count === 0) {
                resultsContent.innerHTML = '<p class="py-12 text-center text-sm text-zinc-500">No results found. Try another search.</p>';
                return;
            }
            const accountSection = activeFilter === 'all' || activeFilter === 'accounts' ? renderAccounts(accounts) : '';
            const mediaSection = activeFilter === 'accounts' ? '' : renderMedia(matchingVideos, matchingPhotos);
            resultsContent.innerHTML = `${accountSection}${mediaSection}`;
            lucide.createIcons();
        }

        async function search(term, remember = false) {
            const normalized = term.trim().toLowerCase();
            clearTimeout(searchTimer);
            searchInput.value = term;
            clearSearchButton.classList.toggle('hidden', !term);
            searchError.classList.add('hidden');
            if (!normalized) {
                searchResults.classList.add('hidden');
                recentSearches.classList.remove('hidden');
                renderHistory();
                currentMatches = { accounts: [], videos: [], photos: [] };
                return;
            }
            if (remember) saveHistory(term.trim());
            recentSearches.classList.add('hidden');
            searchResults.classList.remove('hidden');
            resultsHeading.textContent = 'Searching…';
            resultsContent.innerHTML = '<p class="py-12 text-center text-sm text-zinc-400">Loading search results…</p>';
            try {
                await loadSearchData();
                currentMatches = {
                    accounts: profiles.filter(profile => accountMatches(profile, normalized)),
                    videos: videos.filter(video => !isPhoto(video) && videoMatches(video, normalized))
                        .sort((left, right) => dateValue(right.createdAt) - dateValue(left.createdAt)),
                    photos: videos.filter(video => isPhoto(video) && videoMatches(video, normalized))
                        .sort((left, right) => dateValue(right.createdAt) - dateValue(left.createdAt))
                };
                renderResults(term.trim());
            } catch (error) {
                console.error('Could not search EarnTok:', error);
                resultsHeading.textContent = 'Search unavailable';
                resultsContent.innerHTML = '';
                searchError.textContent = 'Could not load search results. Check your Firestore connection and permissions, then try again.';
                searchError.classList.remove('hidden');
            }
        }

        searchForm.addEventListener('submit', event => {
            event.preventDefault();
            search(searchInput.value, true);
        });
        searchInput.addEventListener('input', () => {
            const term = searchInput.value;
            clearSearchButton.classList.toggle('hidden', !term);
            searchTimer = setTimeout(() => search(term), 250);
        });
        clearSearchButton.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.focus();
            search('');
        });
        document.getElementById('search-filters').addEventListener('click', event => {
            const button = event.target.closest('[data-filter]');
            if (!button) return;
            activeFilter = button.dataset.filter;
            document.querySelectorAll('.search-filter').forEach(filter => {
                filter.classList.toggle('active', filter === button);
            });
            if (searchInput.value.trim()) renderResults(searchInput.value.trim());
        });
        recentSearchList.addEventListener('click', event => {
            const removeButton = event.target.closest('[data-remove-search]');
            if (removeButton) {
                const history = getHistory().filter(term => term !== removeButton.dataset.removeSearch);
                try {
                    localStorage.setItem(historyKey, JSON.stringify(history));
                } catch (error) {
                    console.error('Could not update recent search history:', error);
                }
                renderHistory();
                return;
            }
            const recentButton = event.target.closest('[data-recent-search]');
            if (recentButton) search(recentButton.dataset.recentSearch, true);
        });
        document.getElementById('clear-history-button').addEventListener('click', () => {
            try {
                localStorage.removeItem(historyKey);
            } catch (error) {
                console.error('Could not clear recent search history:', error);
            }
            renderHistory();
        });
        resultsContent.addEventListener('click', event => {
            const card = event.target.closest('[data-video-id]');
            if (!card) return;
            const feed = [...currentMatches.videos, ...currentMatches.photos]
                .sort((left, right) => dateValue(right.createdAt) - dateValue(left.createdAt));
            viewer.open(feed, card.dataset.videoId);
        });

        renderHistory();
        const initialQuery = new URLSearchParams(location.search).get('q') || '';
        if (initialQuery) search(initialQuery, true);
        onAuthStateChanged(auth, user => {
            unsubscribeUnreadMessages?.();
            unsubscribeUnreadMessages = subscribeToUnreadMessages(db, user?.uid);
        }, error => {
            console.error('Could not read authentication state on search:', error);
        });
    </script>
</body>
</html>
